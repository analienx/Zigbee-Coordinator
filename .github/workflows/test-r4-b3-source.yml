name: R4-B3 offline source and actual OSAL C (NOT FLASH)

on:
  push:
    branches:
      - codex/r4-b3-nv-security-offline
  pull_request:
    paths:
      - "docs/r4/b3/**"
      - "firmware/slzb-06p7u/r4/b3/**"
      - "tests/test_r4_b3_*.py"
      - "tests/b3_host/**"
      - ".github/workflows/test-r4-b3-*.yml"

permissions:
  contents: read

jobs:
  b3-synthetic-policy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Enforce no restore / no flash via hostile synthetic archives
        run: python -m unittest -v tests.test_r4_b3_migration
      - name: Python syntax
        run: |
          python -m py_compile firmware/slzb-06p7u/r4/b3/tools/b3_migration_sim.py
          python -m py_compile firmware/slzb-06p7u/r4/b3/tools/b3_source_overlay.py

  b3-actual-osal-c:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Fetch pinned TI SDK exact Git commit (no cached untrusted source)
        run: |
          set -euo pipefail
          mkdir -p /tmp/b3sdk && cd /tmp/b3sdk
          git init -q
          git remote add origin https://github.com/TexasInstruments/simplelink-lowpower-f2-sdk.git
          git -c protocol.version=2 fetch --depth 1 origin 3615ad5d3f4f271258d18a2f5ce1785064ff9a58
          test "$(git rev-parse FETCH_HEAD)" = "3615ad5d3f4f271258d18a2f5ce1785064ff9a58"
          git -c advice.detachedHead=false checkout -q FETCH_HEAD
          test "$(git hash-object source/ti/zstack/osal/osal_nv.c)" = "65c7667475627989cbe2e3f5fdd46335b50eb660"
          test "$(git hash-object source/ti/common/nv/nvocmp.c)" = "01b2b0827d278c10c012b33e5791e53bc5662f10"
      - name: Apply guarded B3 overlays on disposable source only
        run: |
          python firmware/slzb-06p7u/r4/b3/tools/b3_source_overlay.py \
            --sdk /tmp/b3sdk --receipt /tmp/b3-source-receipt.json
          test -s /tmp/b3-source-receipt.json
      - name: Compile actual patched TI OSAL C and invoke real exported functions
        run: |
          set -euo pipefail
          mkdir -p /tmp/b3host
          cp /tmp/b3sdk/source/ti/zstack/osal/osal_nv.c /tmp/b3host/osal_nv.c
          gcc -std=c11 -O0 -g -Wall -Wextra -Werror -Wno-unused-parameter -DZSTACK_GPD \
            -I tests/b3_host /tmp/b3host/osal_nv.c \
            tests/b3_host/osal_driver_test.c -o /tmp/b3host/b3_osal_test
          /tmp/b3host/b3_osal_test
      - name: Negative control — reverting missing-backend fix must fail real C assertion
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          f = Path('/tmp/b3host/osal_nv.c')
          s = f.read_text()
          old = '  uint8_t rtrn = NV_OPER_FAILED;\n  uint8_t status;'
          assert s.count(old) == 1
          f.write_text(s.replace(old, '  uint8_t rtrn = SUCCESS;\n  uint8_t status;'))
          PY
          gcc -std=c11 -O0 -Wall -Wextra -Werror -Wno-unused-parameter -DZSTACK_GPD \
            -I tests/b3_host /tmp/b3host/osal_nv.c \
            tests/b3_host/osal_driver_test.c -o /tmp/b3host/b3_mutant
          ulimit -c 0
          if /tmp/b3host/b3_mutant > /tmp/b3-mutant.log 2>&1; then
            echo "B3 mutation SURVIVED: missing-backend assertion not executed"
            exit 1
          fi
          grep -E 'Assertion|Aborted' /tmp/b3-mutant.log
          echo "Mutation rejected at actual OSAL write function"
