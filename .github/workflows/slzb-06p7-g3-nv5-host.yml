name: SLZB-06P7 G3 native TI NVOCMP five-sector host stress (NO DEVICE)
on:
  pull_request:
    paths:
      - '.github/workflows/slzb-06p7-g3-nv5-host.yml'
      - 'tests/p7-nv5-host/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  genuine-sdk-nvocmp-posix:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: repo
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TexasInstruments/simplelink-lowpower-f2-sdk
          ref: 6499c3f53fc5fb5806213be695450a7b43fbaf3d
          path: sdk
          persist-credentials: false
      - name: Build UNMODIFIED TI8.32 NVOCMP C with strict five-page POSIX NOR mock
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C sdk rev-parse HEAD)" = "6499c3f53fc5fb5806213be695450a7b43fbaf3d"
          mkdir -p nv5-stress
          gcc -std=gnu11 -O2 -g -Wall -Wextra -D_GNU_SOURCE \
            -DNV_LINUX -DNVOCMP_POSIX_MUTEX -DNVOCMP_NVPAGES=5 \
            -Irepo/tests/p7-nv5-host -Isdk/source -Isdk/source/ti/common/nv \
            sdk/source/ti/common/nv/nvocmp.c \
            sdk/source/ti/common/nv/crc.c \
            repo/tests/p7-nv5-host/nv_linux.c \
            repo/tests/p7-nv5-host/nv5_stress.c \
            -pthread -o nv5-stress/ti_nv5_driver_host
          test -x nv5-stress/ti_nv5_driver_host
          git -C sdk diff --exit-code HEAD
      - name: Exercise actual NVOCMP storage and compaction through cold reloads
        shell: bash
        run: |
          set -euo pipefail
          export P7_NV_FILE="$GITHUB_WORKSPACE/nv5-stress/flash-synthetic-40KiB.bin"
          test ! -e "$P7_NV_FILE"
          {
            ./nv5-stress/ti_nv5_driver_host fill 0
            ./nv5-stress/ti_nv5_driver_host verify 0
            ./nv5-stress/ti_nv5_driver_host churn 1
            ./nv5-stress/ti_nv5_driver_host verify 1
            ./nv5-stress/ti_nv5_driver_host compact 1
            ./nv5-stress/ti_nv5_driver_host verify 1
            ./nv5-stress/ti_nv5_driver_host churn 2
            ./nv5-stress/ti_nv5_driver_host verify 2
            ./nv5-stress/ti_nv5_driver_host compact 2
            ./nv5-stress/ti_nv5_driver_host verify 2
          } 2>&1 | tee nv5-stress/driver-test.log
          test "$(stat -c%s "$P7_NV_FILE")" = "40960"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path("nv5-stress")
          log=(root/"driver-test.log").read_text()
          assert log.count("PASS_PINNED_TI_NVOCMP_REAL_DRIVER")==10
          import re as _re
          recs=[int(x) for x in _re.findall(r"records=(\d+)", log)]
          assert len(recs)==10 and len(set(recs))==1, recs
          record_count=recs[0]
          result={
            "status":"TI8.32_NVOCMP_REAL_C_HOST_STRESS_PASS",
            "compiled_original_sdk":"6499c3f53fc5fb5806213be695450a7b43fbaf3d",
            "nv_pages":5,"flash_page_bytes":8192,"synthetic_records":record_count,
            "churn_epochs":2,"explicit_compactions":2,"process_invocations":10,"cold_reloads_after_create":9,
            "simulator_hardware_accurate":False,
            "power_loss_fault_injection_pass":False,
            "production_security_counter_qualified":False,
            "real_smlight_board_qualified":False,
            "flash_authorized":False,
            "synthetic_storage_sha256":hashlib.sha256((root/"flash-synthetic-40KiB.bin").read_bytes()).hexdigest(),
            "host_compilation_and_test_log_sha256":hashlib.sha256(log.encode()).hexdigest()
          }
          (root/"STRESS-VERDICT.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          PY
          # The synthetic flash file is not a firmware image or backup.
          printf '%s\n' 'NO_HARDWARE_USED' 'NO_REAL_ZIGBEE_KEYS' \
            'G3_REAL_TI_NVOCMP_POSIX_SIMULATION_ONLY' > nv5-stress/NOT_FLASHABLE.txt
      - name: Deterministic half-written-NOR interruption and recovery tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nv5-stress/faults
          export P7_NV_FILE="$GITHUB_WORKSPACE/nv5-stress/faults/flash.img"
          ./nv5-stress/ti_nv5_driver_host fill 0 \
            > nv5-stress/faults/initial-fill.log 2>&1
          cp "$P7_NV_FILE" nv5-stress/faults/clean-baseline.img
          : > nv5-stress/faults/fault-results.log
          for number in 1 2 10 50 250 580; do
            cp nv5-stress/faults/clean-baseline.img "$P7_NV_FILE"
            set +e
            P7_FAULT_OP=write P7_FAULT_AFTER="$number" \
              ./nv5-stress/ti_nv5_driver_host churn 1 \
              > nv5-stress/faults/interrupted.log 2>&1
            CODE=$?
            set -e
            if test "$CODE" -ne 77; then
              echo "FAULT_FAILED_TO_TRIGGER number=$number exit=$CODE"
              cat nv5-stress/faults/interrupted.log
              exit 1
            fi
            grep -F 'P7_EXPECTED_SIMULATED_POWER_LOSS op=write' \
              nv5-stress/faults/interrupted.log
            # Independent processes reload the persisted 40KiB region.
            # Valid records must be complete old/new versions, then repair
            # all to one epoch and verify compaction across cold restarts.
            ./nv5-stress/ti_nv5_driver_host recover 1 \
              >> nv5-stress/faults/fault-results.log 2>&1
            ./nv5-stress/ti_nv5_driver_host heal 1 \
              >> nv5-stress/faults/fault-results.log 2>&1
            ./nv5-stress/ti_nv5_driver_host verify 1 \
              >> nv5-stress/faults/fault-results.log 2>&1
            ./nv5-stress/ti_nv5_driver_host compact 1 \
              >> nv5-stress/faults/fault-results.log 2>&1
            ./nv5-stress/ti_nv5_driver_host verify 1 \
              >> nv5-stress/faults/fault-results.log 2>&1
            printf 'PASS_NV5_PARTIAL_WRITE_FAULT index=%s\n' "$number" \
              | tee -a nv5-stress/faults/fault-results.log
          done
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("nv5-stress/faults")
          log=(root/"fault-results.log").read_text()
          assert log.count("PASS_NV5_PARTIAL_WRITE_FAULT")==6
          assert log.count("PASS_PINNED_TI_NVOCMP_REAL_DRIVER")==30
          import re as _re
          recs=[int(x) for x in _re.findall(r"records=(\d+)", log)]
          assert len(recs)==30 and len(set(recs))==1, recs
          record_count=recs[0]
          result={
            "status":"TI8.32_NVOCMP_PARTIAL_WRITE_INTERRUPTION_HOST_PASS",
            "real_sdk_source":"6499c3f53fc5fb5806213be695450a7b43fbaf3d",
            "fault_type":"kill host process halfway through NVS NOR write",
            "fault_indices":[1,2,10,50,250,580],
            "all_record_versions_valid_after_restart":True,
            "all_records_healed_and_compacted_after_restart":True,
            "tested_record_count":record_count,
            "faulted_sector_erase_tested":"see ERASE-VERDICT.json (prefix model only)",
            "real_power_cut_hardware_tested":False,
            "zigbee_security_counter_semantics_qualified":False,
            "flash_authorized":False,
            "synthetic_results_sha256":hashlib.sha256(log.encode()).hexdigest(),
          }
          (root/"PARTIAL-WRITE-VERDICT.json").write_text(
            json.dumps(result,indent=2,sort_keys=True)+"\n")
          PY
      - name: Erase and compaction interruption tests (prefix torn-erase model)
        shell: bash
        run: |
          set -euo pipefail
          export P7_NV_FILE="$GITHUB_WORKSPACE/nv5-stress/faults/flash.img"
          : > nv5-stress/faults/erase-results.log
          # clean-baseline.img holds epoch-0 data; compact verifies its epoch
          # first, so build an epoch-1 baseline before faulting compactNV.
          cp nv5-stress/faults/clean-baseline.img "$P7_NV_FILE"
          ./nv5-stress/ti_nv5_driver_host churn 1 \
            > nv5-stress/faults/epoch1-churn.log 2>&1
          cp "$P7_NV_FILE" nv5-stress/faults/epoch1-baseline.img
          for number in 1 2 3; do
            cp nv5-stress/faults/epoch1-baseline.img "$P7_NV_FILE"
            set +e
            P7_FAULT_OP=erase P7_FAULT_AFTER="$number" \
              ./nv5-stress/ti_nv5_driver_host compact 1 \
              > nv5-stress/faults/erase-interrupted.log 2>&1
            CODE=$?
            set -e
            if test "$CODE" -ne 77; then
              echo "ERASE_FAULT_FAILED_TO_TRIGGER number=$number exit=$CODE"
              cat nv5-stress/faults/erase-interrupted.log
              exit 1
            fi
            grep -F 'P7_EXPECTED_SIMULATED_POWER_LOSS op=erase' \
              nv5-stress/faults/erase-interrupted.log
            # After a torn compaction erase, every record must still read
            # back as the complete epoch-1 version; then re-compact cleanly.
            ./nv5-stress/ti_nv5_driver_host verify 1 \
              >> nv5-stress/faults/erase-results.log 2>&1
            ./nv5-stress/ti_nv5_driver_host compact 1 \
              >> nv5-stress/faults/erase-results.log 2>&1
            ./nv5-stress/ti_nv5_driver_host verify 1 \
              >> nv5-stress/faults/erase-results.log 2>&1
            printf 'PASS_NV5_ERASE_FAULT index=%s\n' "$number" \
              | tee -a nv5-stress/faults/erase-results.log
          done
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("nv5-stress/faults")
          log=(root/"erase-results.log").read_text()
          assert log.count("PASS_NV5_ERASE_FAULT")==3
          result={
            "status":"TI8.32_NVOCMP_ERASE_INTERRUPTION_HOST_PASS",
            "real_sdk_source":"6499c3f53fc5fb5806213be695450a7b43fbaf3d",
            "fault_type":"kill host process halfway through sector erase during compactNV (linear prefix model only)",
            "fault_indices":[1,2,3],
            "torn_erase_geometries_tested":["linear-prefix-half-sector"],
            "suffix_or_interleaved_torn_erase_tested":False,
            "real_power_cut_hardware_tested":False,
            "flash_authorized":False,
            "synthetic_results_sha256":hashlib.sha256(log.encode()).hexdigest(),
          }
          (root/"ERASE-VERDICT.json").write_text(
            json.dumps(result,indent=2,sort_keys=True)+"\n")
          PY
      - name: Garbage and stale-page initial-state probe (evidence only)
        shell: bash
        run: |
          set -euo pipefail
          export P7_NV_FILE="$GITHUB_WORKSPACE/nv5-stress/faults/garbage.img"
          python3 - <<'PY'
          import random
          rng = random.Random(20261012)
          data = bytes(rng.randrange(256) for _ in range(40960))
          open("nv5-stress/faults/garbage.img", "wb").write(data)
          PY
          set +e
          ./nv5-stress/ti_nv5_driver_host fill 0 \
            > nv5-stress/faults/garbage-fill.log 2>&1
          CODE=$?
          set -e
          echo "garbage init/fill exit=$CODE" | tee nv5-stress/faults/garbage-outcome.txt
          cat nv5-stress/faults/garbage-fill.log >> nv5-stress/faults/garbage-outcome.txt
          # Only driver-controlled outcomes are acceptable evidence; a crash
          # signal, backend fatal (90) or fault-injection exit (77) fails.
          case "$CODE" in
            0|4|5) echo "GARBAGE_PROBE_RECORDED exit=$CODE" ;;
            *) echo "GARBAGE_PROBE_UNCONTROLLED exit=$CODE"; exit 1 ;;
          esac
          python3 - <<'PY'
          import json
          from pathlib import Path
          log = Path("nv5-stress/faults/garbage-fill.log").read_text(errors="replace")
          accepted = "PASS_PINNED_TI_NVOCMP_REAL_DRIVER" in log
          result = {
            "status": "GARBAGE_INITIAL_STATE_PROBE_RECORDED",
            "garbage_image_accepted_by_init": accepted,
            "stale_old_layout_adoption_qualified": False,
            "note": "Deterministic pseudo-random 40KiB initial image; outcome recorded, never claimed as migration or recovery proof.",
            "flash_authorized": False,
          }
          Path("nv5-stress/faults/GARBAGE-VERDICT.json").write_text(
            json.dumps(result, indent=2, sort_keys=True) + "\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: P7-G3-REAL-TI-NVOCMP-HOST-STRESS-NO-FIRMWARE
          path: |
            nv5-stress/STRESS-VERDICT.json
            nv5-stress/driver-test.log
            nv5-stress/NOT_FLASHABLE.txt
            nv5-stress/faults/PARTIAL-WRITE-VERDICT.json
            nv5-stress/faults/fault-results.log
            nv5-stress/faults/ERASE-VERDICT.json
            nv5-stress/faults/erase-results.log
            nv5-stress/faults/GARBAGE-VERDICT.json
            nv5-stress/faults/garbage-outcome.txt
          retention-days: 30
          if-no-files-found: error
