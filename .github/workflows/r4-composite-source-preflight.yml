name: R4 Review II composite overlap denial (NO NATIVE BUILD, NO FLASH)
on:
  pull_request:
    paths:
      - 'tools/r4_composite_source_preflight.py'
      - '.github/workflows/r4-composite-source-preflight.yml'
permissions:
  contents: read
jobs:
  detect-unresolved-overlap:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout this exact PR HEAD (not a merge candidate)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Retrieve exact public sibling Git objects read only
        run: |
          set -euo pipefail
          for sha in \
            dc74b44019853f8b6cadf75c4e6e940fc715c906 \
            a514c194ea0d94b5d38b28c7b07ca5caba9aeffd \
            0b06ef8b2fd4fc3008c228208e7a16e1c86d8492 \
            9b72e4fee2cb8adca89c4afed72dfa7db90d5163 \
            b09c6c1c2bb55ff7d46dd85ea15622e7f3a21e6a; do
              git -c protocol.version=2 fetch -q --no-tags --depth 1 origin "$sha"
              test "$(git rev-parse "$sha")" = "$sha"
          done
      - name: Assert blocked-by-overlap status (a green DENIAL is not firmware green)
        run: |
          set -euo pipefail
          python3 tools/r4_composite_source_preflight.py \
            --repo . --receipt /tmp/r4-composite-source-denial.json \
            --expect-blocked
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/r4-composite-source-denial.json').read_text())
          assert x['source_ready'] is False
          assert x['flash_authorized'] is False
          assert x['native_composite_built'] is False
          assert x['integrated_sha'] is None
          assert len(x['b1_b3_unreconciled_donor_paths']) >= 3
          print('EXPECTED_COMPOSITE_DENIAL_VERIFIED — no release/native/flash claims')
          PY
      - name: Upload only blocked compatibility receipt, NEVER firmware
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-composite-BLOCKED-NO-FLASH-${{ github.event.pull_request.head.sha }}
          path: /tmp/r4-composite-source-denial.json
          if-no-files-found: warn
