name: R4 B0-B4 source composite preflight (NO FLASH)
on:
  pull_request:
    paths:
      - '.github/workflows/test-r4-b0b4-composite-source.yml'
      - 'tools/r4_*.py'
      - 'firmware/slzb-06p7u/r4/b1/**'
permissions:
  contents: read
jobs:
  source-fusion:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout exact branch commit, no checkout auth persistence
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Preflight V5 Python source syntax before expensive SDK checkout
        run: |
          python -m py_compile \
            tools/r4_f2_v5_flight.py tools/r4_f2_v5_harness.py \
            host/r4-b4/b4_v5_herdsman_overlay.py \
            host/r4-b4/b4_v5_live_collector_overlay.py \
            host/r4-b4/p7u_f2_v5_pages.py \
            host/r4-b4/p7u_boundary_evidence.py
      - name: Checkout exact pinned TI 8.33 code and immutable B3 #123
        run: |
          set -Eeuo pipefail
          git init -q /tmp/r4fusion-sdk
          git -C /tmp/r4fusion-sdk remote add origin https://github.com/TexasInstruments/simplelink-lowpower-f2-sdk.git
          git -C /tmp/r4fusion-sdk fetch --depth 1 origin 3615ad5d3f4f271258d18a2f5ce1785064ff9a58
          git -C /tmp/r4fusion-sdk checkout -q FETCH_HEAD
          test "$(git -C /tmp/r4fusion-sdk rev-parse HEAD)" = 3615ad5d3f4f271258d18a2f5ce1785064ff9a58
          git init -q /tmp/r4fusion-b3
          git -C /tmp/r4fusion-b3 remote add origin https://github.com/analienx/Zigbee-Coordinator.git
          git -C /tmp/r4fusion-b3 fetch --depth 1 origin b481e0beabf1966900644f69d7f5d024708ebf73
          test "$(git -C /tmp/r4fusion-b3 rev-parse FETCH_HEAD)" = b481e0beabf1966900644f69d7f5d024708ebf73
          git -C /tmp/r4fusion-b3 show b481e0beabf1966900644f69d7f5d024708ebf73:firmware/slzb-06p7u/r4/b3/tools/b3_source_overlay.py > /tmp/r4fusion-b3-overlay.py
          mkdir -p /tmp/r4fusion-sdk/.b1-prerequisites
          curl -fLsS --proto '=https' --tlsv1.2 --retry 3 \
            https://raw.githubusercontent.com/Koenkk/zigbee-herdsman/0968f979d558874b17396c96b66382d4236bbdcd/src/adapter/z-stack/znp/definition.ts \
            -o /tmp/r4fusion-sdk/.b1-prerequisites/herdsman-definition.ts
      - name: B1 actual pinned TI source patch, then B3 fusion
        env:
          B1_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          python firmware/slzb-06p7u/r4/b1/tools/apply_b1.py --sdk /tmp/r4fusion-sdk --receipt /tmp/r4fusion-b1.json
          python tools/r4_b1_b3_security_fuse.py --sdk /tmp/r4fusion-sdk \
            --b3-script /tmp/r4fusion-b3-overlay.py \
            --b3-git-sha b481e0beabf1966900644f69d7f5d024708ebf73 \
            --b1-overlay-receipt /tmp/r4fusion-b1.json \
            --receipt /tmp/r4fusion-receipt.json
          echo "Verify B2/B4 immutable source and one-owner composition atop B1/B3"
          mkdir -p /tmp/r4composite-siblings
          git init -q /tmp/r4composite-repo
          git -C /tmp/r4composite-repo remote add origin https://github.com/analienx/Zigbee-Coordinator.git
          # Fetch all immutable donor commits in one shallow transaction.
          # Individual depth-1 fetches rewrote .git/shallow between Git actions
          # and intermittently failed with "shallow file has changed".
          git -C /tmp/r4composite-repo fetch --depth 1 origin d13a48f5226d42e247a17d9198d84c94a4415030 530a52631fbde274a2ae356c490bad71b47168a6 3231abb1f13210eb88afe13ff7b7f9f29709cd6b
          for sha in d13a48f5226d42e247a17d9198d84c94a4415030 530a52631fbde274a2ae356c490bad71b47168a6 3231abb1f13210eb88afe13ff7b7f9f29709cd6b; do
            git -C /tmp/r4composite-repo cat-file -e "$sha^{commit}"
          done
          git -C /tmp/r4composite-repo show d13a48f5226d42e247a17d9198d84c94a4415030:tools/b2_mto_fail_closed_overlay.py > /tmp/r4composite-siblings/b2_mto_fail_closed_overlay.py
          git -C /tmp/r4composite-repo show 530a52631fbde274a2ae356c490bad71b47168a6:firmware/slzb-06p7u/r4/b2/tools/b2_mto_nv_guard.py > /tmp/r4composite-siblings/b2_mto_failure_guard_overlay.py
          git -C /tmp/r4composite-repo show d13a48f5226d42e247a17d9198d84c94a4415030:tools/b2_compile_actual_mto_nv_timer.py > /tmp/r4composite-siblings/b2_compile_actual_mto_nv_timer.py
          git -C /tmp/r4composite-repo show 3231abb1f13210eb88afe13ff7b7f9f29709cd6b:firmware/slzb-06p7u/r4/b4/b4_native_patch.py > /tmp/r4composite-siblings/b4_native_patch.py
          git -C /tmp/r4composite-repo show 3231abb1f13210eb88afe13ff7b7f9f29709cd6b:firmware/slzb-06p7u/r4/b4/b4_v4_native_patch.py > /tmp/r4composite-siblings/b4_v4_native_patch.py
          python tools/r4_b0_b4_composite_stage.py \
            --sdk /tmp/r4fusion-sdk --baseline /tmp/r4composite-siblings \
            --b1-receipt /tmp/r4fusion-b1.json --fusion-receipt /tmp/r4fusion-receipt.json \
            --b2-script /tmp/r4composite-siblings/b2_mto_fail_closed_overlay.py \
            --b2-failure-script /tmp/r4composite-siblings/b2_mto_failure_guard_overlay.py \
            --b4-v3-script /tmp/r4composite-siblings/b4_native_patch.py \
            --b4-v4-script /tmp/r4composite-siblings/b4_v4_native_patch.py \
            --b2-sha d13a48f5226d42e247a17d9198d84c94a4415030 \
            --b2-failure-sha 530a52631fbde274a2ae356c490bad71b47168a6 \
            --b4-sha 3231abb1f13210eb88afe13ff7b7f9f29709cd6b \
            --receipt /tmp/r4composite-source.json
          python - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('/tmp/r4fusion-receipt.json').read_text())
          b=json.loads(Path('/tmp/r4fusion-b1.json').read_text())
          assert d['source_ready'] is False and d['flash_authorized'] is False
          assert d['b3_nwk_save_monotonic_and_B1_HOLD'] is True
          assert set(d['changed']) == {'source/ti/zstack/stack/sys/zglobals.c', 'source/ti/zstack/stack/zdo/zd_app.c', 'source/ti/zstack/stack/zdo/zd_sec_mgr.c', 'source/ti/zstack/stack/zdo/zd_sec_mgr.h'}
          c=json.loads(Path('/tmp/r4composite-source.json').read_text())
          assert c['source_ready'] is False
          assert c['b1_f1_and_b4_f0_f2_dispatch'] is True
          assert c['ti_uart2_callback_ownership']['source_bytes_equal_pinned_git_blobs'] is True
          assert c['composite_write_scope']['outside_scope_unchanged'] is True
          assert len(c['uart_tx_liveness_actual_c']['cases']) == 6
          assert len(c['uart_tx_liveness_actual_c']['negative_mutants']) == 5
          assert c['f2_v43_request_uart_progress']['reply_bytes'] == 240
          assert c['f2_v43_request_uart_progress']['minor'] == 3
          assert c['f2_v43_actual_c']['status'] == 'PASS_ACTUAL_F2_V43_240_BYTE_PROGRESS_AND_FROZEN_FIRST_FAULT'
          assert c['srsp_service_v44']['reply_bytes'] == 248
          assert c['srsp_service_v44']['minor'] == 4
          assert c['srsp_service_v44_actual_c']['status'] == 'PASS'
          assert c['srsp_reserve_v45']['reserve_slots'] == 3
          assert c['srsp_reserve_v45']['runtime_heap_dependency_for_reserved_path'] is False
          assert c['srsp_reserve_v45_actual_c']['status'] == 'PASS'
          assert c['f2_v5_flight']['legacy_f2_len8_preserved'] is True
          assert c['f2_v5_flight']['flight_events'] == 16
          assert c['f2_v5_actual_c']['status'] == 'PASS'
          assert b['post_b1_security_fusion'] == 'B1_PLUS_SELECTED_B3_IMMUTABLE_INPUTS'
          print('B1+B3 REAL TI SOURCE FUSION VERIFIED (native still required)')
          PY
      - name: Upload only source receipts, no ELF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-b0b4-composite-SOURCE-NOT-FLASH-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/r4fusion-receipt.json
            /tmp/r4fusion-b1.json
            /tmp/r4composite-source.json
          if-no-files-found: warn
