name: Build T832 CC2674P10 control firmware

on:
  push:
    branches:
      - exp/mr4u-p10-ti832-kctrl-r0
    paths:
      - ".github/workflows/t832-build.yml"
      - "firmware/t832/**"
      - "docs/TI_ZNP_CC2674P10_*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t832-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Build and verify T832-KCTRL-R0
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo

      - name: Validate T832 manifest policy
        shell: bash
        run: |
          set -euo pipefail
          python3 repo/firmware/t832/validate_manifest.py repo/firmware/t832/manifest.json

      - name: Install CCS 12.8.0 SimpleLink toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl tar xz-utils \
            libc6-i386 libusb-0.1-4 libncurses5 libtinfo5 \
            libx11-6 libxext6 libxrender1 libxtst6 libxi6 libxt6 libxinerama1 \
            libgtk2.0-0 libnss3 xvfb

          mkdir -p "$HOME/ti/downloads"
          cd "$HOME/ti/downloads"
          CCS_TARBALL=CCS12.8.0.00012_web_linux-x64.tar.gz
          CCS_URL=https://dr-download.ti.com/software-development/ide-configuration-compiler-or-debugger/MD-J1VdearkvK/12.8.0/${CCS_TARBALL}
          curl -fL --retry 5 --retry-delay 2 -o "$CCS_TARBALL" "$CCS_URL"
          tar xzf "$CCS_TARBALL"

          SETUP=$(find . -maxdepth 3 -type f -name 'ccs_setup_12.8.0.00012.run' -print -quit)
          test -n "$SETUP" || { echo "CCS installer not found"; exit 1; }
          chmod +x "$SETUP"
          "$SETUP" \
            --mode unattended \
            --enable-components PF_WCONN \
            --prefix "$HOME/ti/ccs1280"

          SYSCFG_SETUP="$HOME/ti/downloads/sysconfig-1.21.1_3772-setup.run"
          curl -fL --retry 5 --retry-delay 2 \
            -o "$SYSCFG_SETUP" \
            https://software-dl.ti.com/ccs/esd/sysconfig/sysconfig-1.21.1_3772-setup.run
          chmod +x "$SYSCFG_SETUP"
          "$SYSCFG_SETUP" \
            --mode unattended \
            --prefix "$HOME/ti/sysconfig_1.21.1"

      - name: Verify and export exact toolchain
        shell: bash
        run: |
          set -euo pipefail
          TIARMCLANG=$(find "$HOME/ti/ccs1280" -type f -name tiarmclang -perm -u+x -print -quit)
          SYSCONFIG=$(find "$HOME/ti/sysconfig_1.21.1" -type f -name sysconfig_cli.sh -print -quit)
          XDC=$(find "$HOME/ti/ccs1280" -type d -name 'xdctools_3_62_01_16_core' -print -quit)
          CCS_ECLIPSE=$(find "$HOME/ti/ccs1280" -type f -name eclipse -path '*/eclipse/eclipse' -perm -u+x -print -quit)

          test -n "$TIARMCLANG" || { echo "::error::TI ARM Clang missing"; exit 1; }
          test -n "$SYSCONFIG" || { echo "::error::SysConfig 1.21.1 missing"; exit 1; }
          test -n "$XDC" || { echo "::error::XDCTools 3.62.01.16 missing"; exit 1; }
          test -n "$CCS_ECLIPSE" || { echo "::error::CCS Eclipse missing"; exit 1; }

          "$TIARMCLANG" --version | tee /tmp/tiarmclang-version.txt
          grep -F '3.2.2.LTS' /tmp/tiarmclang-version.txt
          case "$SYSCONFIG" in *sysconfig_1.21.1*) ;; *) exit 1;; esac
          case "$XDC" in *xdctools_3_62_01_16_core*) ;; *) exit 1;; esac

          {
            echo "TIARMCLANG=$TIARMCLANG"
            echo "SYSCONFIG=$SYSCONFIG"
            echo "XDC=$XDC"
            echo "CCS_ECLIPSE=$CCS_ECLIPSE"
          } >> "$GITHUB_ENV"

          {
            echo "## T832 toolchain"
            echo "- CCS: 12.8.0.00012"
            echo "- TI ARM Clang: 3.2.2.LTS"
            echo "- SysConfig: 1.21.1.3772"
            echo "- XDCTools: 3.62.01.16"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prefer pinned SysConfig 1.21.1 over CCS-bundled 1.21.0
        shell: bash
        run: |
          set -euo pipefail
          BUNDLED=$(find "$HOME/ti/ccs1280" -maxdepth 5 -type d -name 'sysconfig_1.21.0' -print -quit)
          test -n "$BUNDLED" || { echo "::error::CCS-bundled SysConfig 1.21.0 not found"; exit 1; }
          test -x "$HOME/ti/sysconfig_1.21.1/sysconfig_cli.sh" || { echo "::error::pinned SysConfig 1.21.1 missing"; exit 1; }
          mv "$BUNDLED" "$BUNDLED.orig-1.21.0"
          ln -s "$HOME/ti/sysconfig_1.21.1" "$BUNDLED"
          test "$(readlink "$BUNDLED")" = "$HOME/ti/sysconfig_1.21.1"
          "$BUNDLED/sysconfig_cli.sh" --version > /tmp/sysconfig-version.txt 2>&1 || true
          cat /tmp/sysconfig-version.txt
          {
            echo "## T832 SysConfig pin"
            echo "- CCS-bundled 1.21.0 redirected to standalone 1.21.1.3772 (SDK 8.32 requires >= 1.21.1)."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TexasInstruments/simplelink-lowpower-f2-sdk
          ref: 6499c3f53fc5fb5806213be695450a7b43fbaf3d
          path: sdk

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TexasInstruments/simplelink-lowpower-f2-sdk
          ref: 3615ad5d3f4f271258d18a2f5ce1785064ff9a58
          path: sdk833

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TexasInstruments/simplelink-zstack-examples
          ref: 87ff5b638b632050228a7504f35cf3b95581c278
          path: examples

      - name: Apply fail-closed T832 control delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C repo rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C sdk rev-parse HEAD)" = "6499c3f53fc5fb5806213be695450a7b43fbaf3d"
          test "$(git -C sdk833 rev-parse HEAD)" = "3615ad5d3f4f271258d18a2f5ce1785064ff9a58"
          test "$(git -C examples rev-parse HEAD)" = "87ff5b638b632050228a7504f35cf3b95581c278"

          mkdir -p build-evidence
          python3 repo/firmware/t832/apply_kctrl.py \
            --sdk sdk \
            --examples examples \
            --manifest repo/firmware/t832/manifest.json \
            --evidence build-evidence/patch-evidence.json

          git -C sdk diff --check
          git -C examples diff --check
          git -C sdk diff --binary > build-evidence/T832-KCTRL-R0-sdk.patch
          git -C examples diff --binary > build-evidence/T832-KCTRL-R0-project-seed.patch
          git -C sdk diff --name-only | sort > build-evidence/changed-sdk-files.txt
          git -C examples diff --name-only | sort > build-evidence/changed-example-files.txt

          python3 - <<'PY'
          import subprocess
          sdk_allowed = {
              "source/ti/zstack/apps/znp/znp_cnf.opts",
              "source/ti/zstack/boards/cc13x4_cc26x4/cc13x4_cc26x4_tirtos7_ticlang.cmd",
              "source/ti/zstack/mt/mt_version.c",
              "source/ti/zstack/npi/npi_tl_uart.c",
              "source/ti/zstack/npi/npi_tl_uart.h",
              "source/ti/zstack/stack/nwk/nwk_globals.c",
          }
          examples_allowed = {
              "examples/rtos/LP_EM_CC2674P10/zstack/znp/tirtos7/ticlang/"
              "znp_LP_EM_CC2674P10_tirtos7_ticlang.projectspec",
              "examples/rtos/LP_EM_CC2674P10/zstack/znp/tirtos7/znp.syscfg",
          }
          def changed(repo):
              return set(subprocess.run(
                  ["git", "-C", repo, "diff", "--name-only"],
                  check=True, text=True, capture_output=True
              ).stdout.splitlines())
          if changed("sdk") != sdk_allowed:
              raise SystemExit(f"unclassified SDK delta: {sorted(changed('sdk'))}")
          if changed("examples") != examples_allowed:
              raise SystemExit(f"unclassified project-seed delta: {sorted(changed('examples'))}")
          print("T832 source allowlists: PASS")
          PY

      - name: Prove 8.33 project seed is compatible with pinned 8.32 SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 repo/firmware/t832/audit_contract.py compat \
            --manifest repo/firmware/t832/manifest.json \
            --sdk832 sdk \
            --sdk833 sdk833 \
            --examples examples \
            --evidence build-evidence/project-seed-compatibility.json

      - name: Build pinned SDK libraries with TI documented CMake flow
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cmake >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends cmake
          fi
          cmake --version
          export CMAKE="$(command -v cmake)"
          export TICLANG_ARMCOMPILER="$(dirname "$(dirname "$TIARMCLANG")")"
          export XDC_INSTALL_DIR="$XDC"
          export SYSCONFIG_TOOL="$SYSCONFIG"
          export GCC_ARMCOMPILER=
          export IAR_ARMCOMPILER=
          "$CMAKE" -G"Unix Makefiles" -S sdk -B sdk/build/ticlang --log-level=VERBOSE
          "$CMAKE" --build sdk/build/ticlang --target tirtos7_m33f drivers_cc26x4 display_cc26x4 driverlib_cc13x4_cc26x3_cc26x4 spiffs_m33f_cc26xx
          python3 - <<'PYEOF'
          import pathlib
          import shutil
          import sys
          sdk = pathlib.Path("sdk")
          build = sdk / "build" / "ticlang"
          wanted = {
              "sysbios.a": "kernel/tirtos7/packages/ti/sysbios/lib/ticlang/m33f/sysbios.a",
              "drivers_cc26x4.a": "source/ti/drivers/lib/ticlang/m33f/drivers_cc26x4.a",
              "display_cc26x4.a": "source/ti/display/lib/ticlang/m33f/display_cc26x4.a",
              "driverlib.lib": "source/ti/devices/cc13x4_cc26x4/driverlib/bin/ticlang/driverlib.lib",
              "spiffs_cc26xx.a": "source/third_party/spiffs/lib/ticlang/m33f/spiffs_cc26xx.a",
          }
          built = [p for p in build.rglob("*") if p.suffix in (".a", ".lib") and p.is_file()]
          print("built archives:")
          for p in sorted(built):
              print("  " + str(p.relative_to(sdk)) + " " + str(p.stat().st_size))
          by_name = {}
          for p in built:
              by_name.setdefault(p.name, []).append(p)
          for name, dest in wanted.items():
              cands = by_name.get(name, [])
              if len(cands) != 1:
                  sys.exit("expected exactly one built " + name + ", found " + str(len(cands)))
              src = cands[0]
              if src.stat().st_size == 0:
                  sys.exit("built " + name + " is empty")
              out = sdk / dest
              out.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, out)
              print("installed " + name + " -> " + dest)
          PYEOF
          {
            echo "## T832 SDK libraries"
            echo "- TI-documented top-level CMake configure plus targeted ticlang build of the CC26x4/M33F archives the ZNP link consumes."
            echo "- tirtos7_m4 (Cortex-M4 soft-float sysbios) excluded: its m3-family gcc-syntax asm uses VFP vpush/vpop, rejected by ticlang under soft-float; unrelated to the M33F application."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Register pinned F2 SDK and SysConfig with CCS
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ccs-workspace
          mkdir -p ccs-workspace

          xvfb-run -a "$CCS_ECLIPSE" \
            -noSplash \
            -data "$GITHUB_WORKSPACE/ccs-workspace" \
            -application com.ti.common.core.initialize \
            -ccs.productDiscoveryPath "$GITHUB_WORKSPACE/sdk;$HOME/ti/sysconfig_1.21.1"

      - name: Import hardened CC2674P10 ZNP project seed
        shell: bash
        run: |
          set -euo pipefail
          PROJECTSPEC="$GITHUB_WORKSPACE/examples/examples/rtos/LP_EM_CC2674P10/zstack/znp/tirtos7/ticlang/znp_LP_EM_CC2674P10_tirtos7_ticlang.projectspec"
          test -f "$PROJECTSPEC"

          xvfb-run -a "$CCS_ECLIPSE" \
            -noSplash \
            -data "$GITHUB_WORKSPACE/ccs-workspace" \
            -application com.ti.ccstudio.apps.projectCreate \
            -ccs.projectSpec "$PROJECTSPEC" \
            -ccs.overwrite

          IMPORTED_OPTS=$(find ccs-workspace -type f -path '*/Stack/Config/znp_cnf.opts')
          test "$(printf '%s\n' "$IMPORTED_OPTS" | sed '/^$/d' | wc -l)" = 1
          test "$(sha256sum sdk/source/ti/zstack/apps/znp/znp_cnf.opts | cut -d' ' -f1)" = \
               "$(sha256sum "$IMPORTED_OPTS" | cut -d' ' -f1)"

      - name: Bind CCS SysConfig slot to pinned 1.21.1
        shell: bash
        run: |
          set -euo pipefail
          BUNDLED_DIR="$HOME/ti/ccs1280/ccs/utils/sysconfig_1.21.0"
          PINNED_DIR="$HOME/ti/sysconfig_1.21.1"
          test -d "$BUNDLED_DIR"
          test -x "$PINNED_DIR/sysconfig_cli.sh"

          # CCS 12.8 emits the bundled 1.21.0 path only when the build makefile
          # is generated, so post-import makefile rewriting is too early. Keep
          # CCS's expected path stable but bind it to the exact standalone
          # 1.21.1.3772 installation before the first build invocation.
          rm -rf "$BUNDLED_DIR"
          ln -s "$PINNED_DIR" "$BUNDLED_DIR"
          test "$(readlink -f "$BUNDLED_DIR")" = "$(readlink -f "$PINNED_DIR")"
          test -x "$BUNDLED_DIR/sysconfig_cli.sh"

          {
            echo "ccs_expected_path=$BUNDLED_DIR"
            echo "resolved_path=$(readlink -f "$BUNDLED_DIR")"
            echo "pinned_cli=$SYSCONFIG"
            echo "pinned_cli_sha256=$(sha256sum "$SYSCONFIG" | cut -d' ' -f1)"
          } > build-evidence/sysconfig-selection.txt
          "$BUNDLED_DIR/sysconfig_cli.sh" --version 2>&1 | tee -a build-evidence/sysconfig-selection.txt || true

      - name: Build only T832-KCTRL-R0 ZNP project
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          xvfb-run -a "$CCS_ECLIPSE" \
            -noSplash \
            -data "$GITHUB_WORKSPACE/ccs-workspace" \
            -application com.ti.ccstudio.apps.projectBuild \
            -ccs.projects znp_LP_EM_CC2674P10_tirtos7_ticlang \
            -ccs.configuration default \
            2>&1 | tee build-evidence/ccs-build.log

          OUT=$(find ccs-workspace -type f -name '*.out' -print -quit)
          MAP=$(find ccs-workspace -type f -name '*.map' -print -quit)
          GENH=$(find ccs-workspace -type f -name 'ti_zstack_config.h' -print -quit)
          OPTS=$(find ccs-workspace -type f -path '*/Stack/Config/znp_cnf.opts' -print -quit)
          test -n "$OUT" || { echo "::error::No .out produced"; exit 1; }
          test -n "$MAP" || { echo "::error::No linker .map produced"; exit 1; }
          test -n "$GENH" || { echo "::error::No generated ti_zstack_config.h produced"; exit 1; }
          test -n "$OPTS" || { echo "::error::No imported znp_cnf.opts found"; exit 1; }

          {
            echo "OUT=$OUT"
            echo "MAP=$MAP"
            echo "GENH=$GENH"
            echo "OPTS=$OPTS"
          } >> "$GITHUB_ENV"

      - name: Generate effective compiler-macro proof
        shell: bash
        run: |
          set -euo pipefail
          cat > build-evidence/t832-macro-probe.c <<'EOF'
          /*
           * T832 evidence-only preprocessor probe. Runtime code is never linked.
           * Include the exact SysConfig-generated Zigbee header so command-line
           * KCTRL defines are proven against the same #ifndef defaults used by
           * the real project.
           */
          #include "ti_zstack_config.h"
          EOF

          GENH_DIR="$(dirname "$GENH")"
          "$TIARMCLANG" \
            -dM -E -x c \
            -I"$GENH_DIR" \
            @"$OPTS" \
            build-evidence/t832-macro-probe.c \
            > build-evidence/effective-macros.txt

          # Keep the generated header and the exact probe input as evidence.
          cp "$GENH" build-evidence/ti_zstack_config.h
          {
            echo "generated_header=$GENH"
            echo "generated_header_sha256=$(sha256sum "$GENH" | cut -d' ' -f1)"
            echo "imported_opts=$OPTS"
            echo "imported_opts_sha256=$(sha256sum "$OPTS" | cut -d' ' -f1)"
            echo "probe_includes=ti_zstack_config.h"
          } > build-evidence/macro-probe-contract.txt

      - name: Enforce compiled capacity, NVS, stack and SRAM contract
        shell: bash
        run: |
          set -euo pipefail
          python3 repo/firmware/t832/audit_contract.py build \
            --manifest repo/firmware/t832/manifest.json \
            --patch-evidence build-evidence/patch-evidence.json \
            --sdk sdk \
            --workspace ccs-workspace \
            --effective-macros build-evidence/effective-macros.txt \
            --generated-header "$GENH" \
            --map-file "$MAP" \
            --out-file "$OUT" \
            --evidence build-evidence/compiled-contract.json

      - name: Package flash artifact and evidence
        shell: bash
        run: |
          set -euo pipefail
          TIARMOBJCOPY="$(dirname "$TIARMCLANG")/tiarmobjcopy"
          test -x "$TIARMOBJCOPY"

          mkdir -p bundle/linked bundle/generated bundle/provenance
          cp "$OUT" bundle/T832-KCTRL-R0.out
          "$TIARMOBJCOPY" "$OUT" --output-target ihex bundle/T832-KCTRL-R0.hex

          cp "$MAP" bundle/linked/
          find ccs-workspace -type f -name '*linkInfo.xml' -exec cp {} bundle/linked/ \;
          find ccs-workspace -type f \( \
              -name 'ti_devices_config.c' -o \
              -name 'ti_drivers_config.c' -o \
              -name 'ti_drivers_config.h' -o \
              -name 'ti_radio_config.c' -o \
              -name 'ti_radio_config.h' -o \
              -name 'ti_zstack_config.h' -o \
              -name 'ti_zstack_config.c' \
            \) -exec cp {} bundle/generated/ \;

          test -s bundle/T832-KCTRL-R0.hex
          test -s bundle/T832-KCTRL-R0.out
          cp repo/firmware/t832/manifest.json bundle/provenance/manifest.json
          cp repo/firmware/t832/README.md bundle/README.md
          cp build-evidence/* bundle/provenance/

          {
            echo "variant=T832-KCTRL-R0"
            echo "repo_commit=$GITHUB_SHA"
            echo "sdk_commit=$(git -C sdk rev-parse HEAD)"
            echo "sdk_833_compat_commit=$(git -C sdk833 rev-parse HEAD)"
            echo "examples_commit=$(git -C examples rev-parse HEAD)"
            echo "ccs=12.8.0.00012"
            printf "tiarmclang="; "$TIARMCLANG" --version | head -1
            echo "sysconfig=1.21.1.3772"
            echo "xdctools=3.62.01.16"
          } > bundle/provenance/TOOLCHAIN.txt

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          artifacts = {}
          for name in ("T832-KCTRL-R0.hex", "T832-KCTRL-R0.out"):
              p = Path("bundle") / name
              artifacts[name] = {
                  "bytes": p.stat().st_size,
                  "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
              }
          evidence = {
              "compiled_contract": hashlib.sha256(
                  Path("build-evidence/compiled-contract.json").read_bytes()
              ).hexdigest(),
              "project_seed_compatibility": hashlib.sha256(
                  Path("build-evidence/project-seed-compatibility.json").read_bytes()
              ).hexdigest(),
          }
          out = {
              "variant": "T832-KCTRL-R0",
              "repository_commit": os.environ["GITHUB_SHA"],
              "sdk_commit": "6499c3f53fc5fb5806213be695450a7b43fbaf3d",
              "sdk_833_compat_commit": "3615ad5d3f4f271258d18a2f5ce1785064ff9a58",
              "examples_commit": "87ff5b638b632050228a7504f35cf3b95581c278",
              "artifacts": artifacts,
              "evidence_sha256": evidence,
              "flash_authorized": False,
              "note": "CI build integrity does not satisfy production board/backup/CCFG gates.",
          }
          Path("bundle/T832-BUILD-MANIFEST.json").write_text(
              json.dumps(out, indent=2) + "\n"
          )
          PY

          (cd bundle && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)

          {
            echo
            echo "## T832-KCTRL-R0 artifact"
            jq -r '"- HEX: \(.artifacts["T832-KCTRL-R0.hex"].bytes) bytes — `\(.artifacts["T832-KCTRL-R0.hex"].sha256)`"' bundle/T832-BUILD-MANIFEST.json
            echo "- Project-seed compatibility: **PASS**"
            echo "- Compiled capacity/NVS/stack/RAM contract: **PASS**"
            echo "- Flash authorization: **NO** — board/CCFG/recovery/backup gates remain separate."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mr4u-p10-t832-kctrl-r0
          path: bundle/
          compression-level: 9
          retention-days: 30
          if-no-files-found: error
