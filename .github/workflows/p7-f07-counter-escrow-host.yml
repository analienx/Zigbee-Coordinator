name: F07 NWK counter escrow pinned SDK hosted negatives (NOT FLASHABLE)
on:
  push:
    branches: ['feat/p7u-f07-counter-escrow-*']
  pull_request:
    paths:
      - '.github/workflows/p7-f07-counter-escrow-host.yml'
      - 'firmware/slzb-06p7/ti832/f07/**'
      - 'tests/p7-f07-host/**'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  pinned-counter-escrow:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: repo, persist-credentials: false}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TexasInstruments/simplelink-lowpower-f2-sdk
          ref: 6499c3f53fc5fb5806213be695450a7b43fbaf3d
          path: sdk
          persist-credentials: false
      - name: Prove genuine pinned C helper and malformed NV/counter fault cases
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C sdk rev-parse HEAD)" = 6499c3f53fc5fb5806213be695450a7b43fbaf3d
          python3 repo/tests/p7-f07-host/test_f07.py --sdk sdk
          python3 repo/tests/p7-f07-host/test_f07_restore.py --sdk sdk
          python3 repo/tests/p7-f07-host/test_f07_counter_escrow.py --sdk sdk
          echo "F07_NWK_ESCROW_HOST_ONLY_NOT_FLASHABLE"
