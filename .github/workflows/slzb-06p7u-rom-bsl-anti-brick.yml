name: P7U ROM BSL anti-brick HEX negative tests (NOT FLASHABLE)
on:
  pull_request:
    paths:
      - 'firmware/slzb-06p7u/qualification/p7u_rom_bsl_image_gate.py'
      - 'tests/p7u-rom-bsl-gate/**'
      - '.github/workflows/slzb-06p7u-rom-bsl-anti-brick.yml'
  push:
    branches: ['feat/p7u-rom-bsl-anti-brick-gate-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hostile-pure-python-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - name: Reject any HEX containing dangerous CCFG, lost ROM BSL or NV writes
        run: |
          set -euo pipefail
          python3 -m py_compile firmware/slzb-06p7u/qualification/p7u_rom_bsl_image_gate.py firmware/slzb-06p7u/qualification/p7u_app_sector_plan.py tests/p7u-rom-bsl-gate/test_rom_bsl_gate.py
          python3 tests/p7u-rom-bsl-gate/test_rom_bsl_gate.py
          echo "NO_DEVICE_NO_FLASH_NO_KEY_OR_NV_ACCESS"
