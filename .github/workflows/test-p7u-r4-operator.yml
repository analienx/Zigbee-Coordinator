name: P7U R4 one-command operator safety checks

on:
  pull_request:
    paths:
      - '.github/workflows/test-p7u-r4-operator.yml'
      - 'firmware/slzb-06p7u/r4/release/p7u_r4_operator.py'
      - 'firmware/slzb-06p7u/r4/release/p7u_r4_adapter_provision.py'
      - 'tests/test_p7u_r4_adapter_provision.py'
      - 'tests/test_p7u_r4_operator.py'
      - 'tests/test_p7u_r4_startup_observer.py'
      - 'firmware/slzb-06p7u/r4/release/p7u_r4_startup_observer.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operator-safety:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python-only offline qualification
        run: |
          python --version
          python -m py_compile firmware/slzb-06p7u/r4/release/p7u_r4_operator.py firmware/slzb-06p7u/r4/release/p7u_r4_startup_observer.py firmware/slzb-06p7u/r4/release/p7u_r4_adapter_provision.py
          python -m unittest -v tests.test_p7u_r4_operator tests.test_p7u_r4_startup_observer tests.test_p7u_r4_adapter_provision
      - name: No operator script may touch an unapproved live radio in CI
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('firmware/slzb-06p7u/r4/release/p7u_r4_operator.py').read_text()
          for forbidden in ('erase_sector(', 'send_data(', 'begin_download(', 'api2', 'ha apps start'):
              assert forbidden not in src, forbidden
          print('OPERATOR_ONLY_NO_DEVICE_IO')
          PY
