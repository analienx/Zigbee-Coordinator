name: P7U genuine TI NPI/MT transport native (NO FLASH)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'firmware/slzb-06p7u/r4/qualification/transport_profile.py'
      - 'firmware/slzb-06p7u/r4/qualification/build_native.py'
      - 'firmware/slzb-06p7u/r4/qualification/native_profile_audit.py'
      - 'firmware/slzb-06p7u/r4/qualification/rtos_context_audit.py'
      - 'tests/test_r4_transport_profile.py'
      - '.github/workflows/test-r4-npi-native.yml'

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  offline:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest -v tests.test_r4_transport_profile tests.test_r4_m4f_asm_preprocessing

  native:
    needs: offline
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pin CMake native ASM preprocessing
        run: python -m pip install --disable-pip-version-check cmake==3.31.6
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /tmp/b0ti/downloads
          key: r4-b0-ti-linux-ccs-fa807c9e-syscfg-0c1674f8-clang-2864bb10
      - name: TI compiler runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libtinfo5
      - name: Install checksum-pinned TI toolchain
        env:
          TI_CCS_SHA256: ${{ secrets.TI_CCS_SHA256 }}
          TI_SYSCONFIG_SHA256: ${{ secrets.TI_SYSCONFIG_SHA256 }}
          TI_CLANG_SHA256: ${{ secrets.TI_CLANG_SHA256 }}
        run: |
          python firmware/slzb-06p7u/r4/b0/tools/b0_install_ti.py --root /tmp/b0ti --github-env "$GITHUB_ENV" --github-path "$GITHUB_PATH"
      - name: Verify toolchain and SysConfig
        run: |
          python firmware/slzb-06p7u/r4/b0/tools/b0_provision.py provision --out /tmp/provision.json
          python firmware/slzb-06p7u/r4/b0/tools/b0_bind_sysconfig.py --ccs-eclipse "$CCS_ECLIPSE" --standalone-cli "$SYSCONFIG_CLI" --receipt /tmp/sysconfig-binding.json
      - name: Compile genuine TI NPI MT SYS transport, verify linked M4F and three APP sectors
        run: |
          python firmware/slzb-06p7u/r4/qualification/build_native.py --profile transport-only --output /tmp/qualification --source-sha "$SOURCE_SHA" --reference-power vendor-20240716
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p7u-ti-npi-${{ env.SOURCE_SHA }}
          path: |
            /tmp/qualification/
            /tmp/provision.json
            /tmp/sysconfig-binding.json
          if-no-files-found: error
