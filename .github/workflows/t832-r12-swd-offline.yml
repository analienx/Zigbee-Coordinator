name: T832 R12 offline independent startup POD readiness

on:
  push:
    branches: [codex/t832-r12-forensics]
    paths:
      - 'firmware/t832/r12/**'
      - 'docs/T832_R12_NON_RESET_FORENSICS.md'
      - '.github/workflows/t832-r12-swd-offline.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: t832-r12-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-readiness:
    name: Offline parser and exact-R11 provenance
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Offline synthetic and adversarial parser tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s firmware/t832/r12 -p 'test_*.py' -v

      - name: Fetch immutable hosted R11 diagnostic artifact (no hardware)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/r11-matched
          gh run download 37967989446 --repo analienx/Zigbee-Coordinator \
            --name t832-r11-DIAG-vendor-20240716 --dir /tmp/r11-matched
          test -f /tmp/r11-matched/T832-BUILD-MANIFEST.json
          test -f /tmp/r11-matched/T832-R11-DIAG-vendor-20240716.map
          test -f /tmp/r11-matched/T832-R11-DIAG-vendor-20240716.out

      - name: Verify real source, binary, ELF, map and linked startup POD
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 firmware/t832/r12/r12_swd_offline.py symbols \
            --artifact-dir /tmp/r11-matched --out evidence/r12-exact-symbols.json
          python3 - <<'PYEOF'
          import json
          d = json.load(open("evidence/r12-exact-symbols.json"))
          assert d["state"] == "SYMBOLS_VERIFIED_NO_HARDWARE_PROOF"
          assert d["startup_pod"] == {
              "symbol": "t832R11Startup",
              "address": "0x20001220",
              "length": 20,
              "binding": "section_and_symbol_match",
          }
          assert d["hardware_access_proven"] is False
          assert d["live_debug_issued"] is False
          assert d["image"]["revision"] == 8320052
          print("Exact linked-symbol verification PASS; hardware remains BLOCKED")
          PYEOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: t832-r12-offline-readiness
          path: evidence/r12-exact-symbols.json
          if-no-files-found: error
          retention-days: 30
