name: Python tests

on:
  pull_request:
  push:
    branches:
      - feat/mr4u-p10-r2-reset-helper
      - codex/p7u-shared-recovery-policy-20261022

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile helper
        run: python -m py_compile deploy/p10_radio_reset.py
      - name: Run R2 reset helper tests
        run: python -m unittest -v tests.test_p10_radio_reset
