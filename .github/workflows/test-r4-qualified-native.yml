name: P7U early driverlib UART poll native (NO FLASH)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'firmware/slzb-06p7u/r4/qualification/**'
      - 'firmware/slzb-06p7u/r4/release/r4_current_*.py'
      - 'firmware/slzb-06p7u/r4/release/r4_app_sector_transaction.py'
      - 'firmware/slzb-06p7u/r4/b0/tools/**'
      - 'firmware/slzb-06p7u/r4/b1/tools/**'
      - 'firmware/slzb-06p7u/r4/release/r4_prepare_direct_rom_boot.py'
      - 'firmware/slzb-06p7u/r4/release/r4_preserve_resident_boot_nvs.py'
      - 'tests/test_r4_*'
      - '.github/workflows/test-r4-qualified-native.yml'

permissions:
  contents: read

concurrency:
  group: p7u-qualified-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  offline-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: One focused polling source and linked-symbol test
        run: python -m unittest -v tests.test_r4_uart_poll_profile

  native:
    needs: offline-tests
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        replica: [1]
        power: [vendor-20240716]
    env:
      R4Q_REPLICA: ${{ matrix.replica }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /tmp/b0ti/downloads
          key: r4-b0-ti-linux-ccs-fa807c9e-syscfg-0c1674f8-clang-2864bb10
      - name: TI compiler runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libtinfo5
      - name: Install checksum-pinned TI toolchain
        env:
          TI_CCS_SHA256: ${{ secrets.TI_CCS_SHA256 }}
          TI_SYSCONFIG_SHA256: ${{ secrets.TI_SYSCONFIG_SHA256 }}
          TI_CLANG_SHA256: ${{ secrets.TI_CLANG_SHA256 }}
        run: |
          python firmware/slzb-06p7u/r4/b0/tools/b0_install_ti.py --root /tmp/b0ti --github-env "$GITHUB_ENV" --github-path "$GITHUB_PATH"
      - name: Verify toolchain and bind standalone SysConfig
        run: |
          python firmware/slzb-06p7u/r4/b0/tools/b0_provision.py provision --out /tmp/provision.json
          python firmware/slzb-06p7u/r4/b0/tools/b0_bind_sysconfig.py --ccs-eclipse "$CCS_ECLIPSE" --standalone-cli "$SYSCONFIG_CLI" --receipt /tmp/sysconfig-binding.json
      - name: Compile and audit one early polled UART image
        run: |
          python firmware/slzb-06p7u/r4/qualification/build_native.py --output /tmp/qualification --source-sha "$SOURCE_SHA" --reference-power '${{ matrix.power }}' --profile uart-poll
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p7u-uart-poll-${{ env.SOURCE_SHA }}-${{ matrix.power }}-${{ matrix.replica }}
          path: |
            /tmp/qualification/
            /tmp/provision.json
            /tmp/sysconfig-binding.json
          if-no-files-found: error

