name: P7U qualification transport dual native (NO FLASH)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'firmware/slzb-06p7u/r4/qualification/**'
      - 'firmware/slzb-06p7u/r4/release/r4_current_*.py'
      - 'firmware/slzb-06p7u/r4/release/r4_app_sector_transaction.py'
      - 'firmware/slzb-06p7u/r4/b0/tools/**'
      - 'firmware/slzb-06p7u/r4/release/r4_prepare_direct_rom_boot.py'
      - 'firmware/slzb-06p7u/r4/release/r4_preserve_resident_boot_nvs.py'
      - 'tests/test_r4_*'
      - '.github/workflows/test-r4-qualified-native.yml'

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  offline-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Qualification and legacy protection tests
        run: |
          python -m unittest discover -s tests -p 'test_r4_*profile*.py' -v
          python -m unittest -v tests.test_r4_capture_pair tests.test_r4_nv_compatibility tests.test_r4_current_board_profile tests.test_r4_current_app_package tests.test_r4_app_sector_transaction tests.test_r4_b0_verify_generated_board tests.test_r4_make_direct_app_only tests.test_r4_boot_sector_transaction

  native:
    needs: offline-tests
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
        power: [historical-20240710, historical-fitted-20260311]
    env:
      R4Q_REPLICA: ${{ matrix.replica }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /tmp/b0ti/downloads
          key: r4-b0-ti-linux-ccs-fa807c9e-syscfg-0c1674f8-clang-2864bb10
      - name: TI compiler runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libtinfo5
      - name: Install checksum-pinned TI toolchain
        env:
          TI_CCS_SHA256: ${{ secrets.TI_CCS_SHA256 }}
          TI_SYSCONFIG_SHA256: ${{ secrets.TI_SYSCONFIG_SHA256 }}
          TI_CLANG_SHA256: ${{ secrets.TI_CLANG_SHA256 }}
        run: |
          python firmware/slzb-06p7u/r4/b0/tools/b0_install_ti.py --root /tmp/b0ti --github-env "$GITHUB_ENV" --github-path "$GITHUB_PATH"
      - name: Verify toolchain and bind standalone SysConfig
        run: |
          python firmware/slzb-06p7u/r4/b0/tools/b0_provision.py provision --out /tmp/provision.json
          python firmware/slzb-06p7u/r4/b0/tools/b0_bind_sysconfig.py --ccs-eclipse "$CCS_ECLIPSE" --standalone-cli "$SYSCONFIG_CLI" --receipt /tmp/sysconfig-binding.json
      - name: Compile and independently audit real transport firmware
        run: |
          python firmware/slzb-06p7u/r4/qualification/build_native.py --output /tmp/qualification --source-sha "$SOURCE_SHA" --reference-power '${{ matrix.power }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p7u-transport-${{ env.SOURCE_SHA }}-${{ matrix.power }}-${{ matrix.replica }}
          path: |
            /tmp/qualification/
            /tmp/provision.json
            /tmp/sysconfig-binding.json
          if-no-files-found: error

  reproducibility:
    needs: native
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        power: [historical-20240710, historical-fitted-20260311]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p7u-transport-${{ env.SOURCE_SHA }}-${{ matrix.power }}-1
          path: /tmp/replica1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: p7u-transport-${{ env.SOURCE_SHA }}-${{ matrix.power }}-2
          path: /tmp/replica2
      - name: Compare actual HEX and BIN from independent builds
        run: |
          python firmware/slzb-06p7u/r4/qualification/compare_replicas.py --first /tmp/replica1/qualification --second /tmp/replica2/qualification --source-sha "$SOURCE_SHA" --reference '${{ matrix.power }}' --output /tmp/reproducibility.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p7u-reproducibility-${{ env.SOURCE_SHA }}-${{ matrix.power }}
          path: /tmp/reproducibility.json
