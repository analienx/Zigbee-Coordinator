name: T832-MIN M1 CI (hosted-only T1-T5)

# NOT_PRODUCTION_QUALIFIED. Hosted-only gates: no flash, no hardware, no HA/Z2M.
on:
  pull_request:
  push:
    branches:
      - codex/t832-min-v4-m0m2

permissions:
  contents: read

jobs:
  t1-pins:
    name: T1 pins and provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate upstream lock pins
        run: |
          python - <<'EOF'
          import json
          lock = json.load(open("firmware/t832/min/upstream.lock.json"))
          assert lock["status"] == "NOT_PRODUCTION_QUALIFIED"
          assert lock["ti_sdk"]["commit"] == "6499c3f53fc5fb5806213be695450a7b43fbaf3d"
          assert lock["p10_znp_example"]["commit"] == "87ff5b638b632050228a7504f35cf3b95581c278"
          tc = lock["toolchain"]
          assert (tc["xdctools"], tc["ccs"], tc["ti_clang"], tc["sysconfig"]) == ("3.62.01.15", "12.8", "3.2.2", "1.21.1"), tc
          assert lock["herdsman"]["package"] == "zigbee-herdsman"
          print("T1 pins OK; herdsman pin:", lock["herdsman"]["version"], lock["herdsman"]["status"])
          EOF
      - name: Resolve Herdsman exact pin attempt via npm
        run: |
          npm view zigbee-herdsman version || echo "HERDSMAN_RESOLVE_ATTEMPTED_OFFLINE=1"
          npm view zigbee-herdsman@10.9.1 version || echo "HERDSMAN_10_9_1_RESOLVE_ATTEMPTED=1"
      - name: Secrets scan (fail on key material)
        run: |
          ! grep -rniE "network_key|link_key|passphrase|private_key|BEGIN .*PRIVATE" firmware/t832/min docs/T832_MIN_M1_DESIGN.md || (echo "SECRET_SCAN_FAIL" && exit 1)
          echo "SECRET_SCAN_PASS"

  t2-patch:
    name: T2 patch determinism and R10-absence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Patcher selftest (determinism + fail-closed anchors)
        run: python firmware/t832/min/patch_min.py --selftest
      - name: R10-absence gate
        run: python firmware/t832/min/patch_min.py --check-r10-absence
      - name: Diff allowlist
        run: python firmware/t832/min/diff_contract.py --allowlist

  t3-board:
    name: T3 board contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PROVEN vs HARDWARE_BLOCKED validation
        run: |
          python - <<'EOF'
          import json
          c = json.load(open("firmware/t832/min/board/mr4u_board_contract.json"))
          assert c["status"] == "NOT_PRODUCTION_QUALIFIED"
          f = c["fields"]
          assert f["target_device"]["verdict"] == "PROVEN"
          for k in ("rom_bsl", "clock_hf_xosc", "vdrr_rf_config", "rf_pa_variant", "ccfg_delta", "pin_map"):
              assert f[k]["verdict"] == "HARDWARE_BLOCKED", k
          print("T3 board contract OK")
          EOF

  t4-nv-mt:
    name: T4 NV integrity and MT dispatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: NV lab self-check
        run: python firmware/t832/min/nv_lab.py --self-check
      - name: Compiler verifier (static)
        run: python firmware/t832/min/verify_compiler.py
      - name: MT dispatch presence via node
        run: |
          node -e 'const h=require("./firmware/t832/min/host_contract.cjs"); const need=["SYS/PING","SYS/VERSION","SYS/NV_LENGTH","SYS/NV_READ","SYS/NV_WRITE","ZDO/MGMT_LQI_REQ","ZDO/MGMT_LQI_RSP","AF/DATA_REQUEST","AF/INCOMING_MSG","NV/TCLK_LENGTH","UTIL/GET_DEVICE_INFO"]; for (const k of need){ if(!h.MT_DISPATCH[k]){ console.error("MISSING "+k); process.exit(1);} } console.log("T4 MT dispatch OK entries="+Object.keys(h.MT_DISPATCH).length);'

  t5-host-pack-test:
    name: T5 host contract, pack, unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Host contract selftest
        run: node firmware/t832/min/host_contract.cjs
      - name: Pack manifest check
        run: python firmware/t832/min/pack.py --check
      - name: M1 contract unit test
        run: python -m unittest -v tests.test_t832_min_contract
