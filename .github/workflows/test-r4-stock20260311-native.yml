          # whole 8KiB erase sector, even if its sparse records omit NV.
          # This is a DENIAL, never a flash/erase/restore authorization.
          HEX_NAME="$(python -c "import json;print(json.load(open('/tmp/b0out/manifest.json'))['files']['hex']['file'])")"
          python "$GITHUB_WORKSPACE/firmware/slzb-06p7u/r4/b0/tools/b0_sector_erase_denial.py" \
            --hex "/tmp/b0out/$HEX_NAME" --receipt /tmp/b0out/b0-sector-DENY.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/b0out/b0-sector-DENY.json').read_text())
          m=json.loads(Path('/tmp/b0out/manifest.json').read_text())
          assert d['status']=='BLOCKED_PROTECTED_SECTOR_ERASE'
          assert d['flash_authorized'] is False and d['production_flash_authorized'] is False
          assert d['source_hex_sha256']==m['files']['hex']['sha256']
          assert any(x['reason']=='BOOT_CCFG_TOP_SECTOR' for x in d['protected_sector_collisions'])
          print('REAL EXACT-HEAD COMPOSITE HEX: CCFG erase-sector collision proven; FLASH DENIED')
          PY
          # Independent conservative APP address bound; not a flash permit.
          python "$GITHUB_WORKSPACE/firmware/slzb-06p7u/r4/release/r4_flash_preflight.py" \
            --artifacts /tmp/b0out --receipt /tmp/b0out/r4-app-sector-preflight.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/b0out/r4-app-sector-preflight.json').read_text())
          sectors=[int(s,16) for s in r['application_sectors']]
          assert r['expected_vector_offset']=='0x0'
          assert sectors and min(sectors)==0
          assert all(0 <= s < 0xA0000 and s%0x2000==0 for s in sectors)
          assert int(r['last_application_byte_exclusive'],16)<=0xA0000
          assert r['flash_authorized'] is False
          print('FULL NV4 CONSERVATIVE APP BOUND, NO FLASH',len(sectors))
          PY
          # All APP sectors FF padded; receipt orders vector sector LAST.
          python "$GITHUB_WORKSPACE/firmware/slzb-06p7u/r4/qualification/full_nv4_app_only.py" \
            --artifacts /tmp/b0out --out-dir /tmp/b0out/r4-full-nv4-app-only --stock20260311 \
            --manifest-sha256 "$(sha256sum /tmp/b0out/manifest.json | cut -d' ' -f1)"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/b0out/r4-full-nv4-app-only')
          r=json.loads((root/'r4-full-nv4-app-only-receipt.json').read_text())
          assert r['image_class']=='STOCK20260311_APP_VECTOR_ZERO_UNBOOTABLE_UNTIL_SEPARATE_BOOT_HANDOFF'
          assert r['full_b0_b4_sealed'] is False and r['flash_authorized'] is False
          assert r['vector_last_program_order'][-1]=='0x00000'
          assert r['sectors_to_program']==len(r['application_sectors'])
          assert all(int(s,16)<0xA0000 for s in r['application_sectors'])
          print('FULL NV4 APP-ONLY FF-PADDED HEX UNSEALED; NO FLASH')
          PY
          python "$GITHUB_WORKSPACE/firmware/slzb-06p7u/r4/b1/tools/seal_native.py" \
            --artifacts /tmp/b0out --sdk "$sdk" --expected-sha "$B1_SOURCE_SHA" --nv4-bridge --stock20260311
          echo "Independently re-read ACTUAL composite ELF route table counts, not compiler-flag guesses"
          python /tmp/r4-composite-sources/b2_collect_native_evidence.py \
            --artifacts /tmp/b0out --out /tmp/b0out/b2-linked \
            --source-sha "$B1_SOURCE_SHA" --run-id "$GITHUB_RUN_ID"
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('/tmp/b0out/b2-linked/B2_BASELINE_ELF_SYMBOLS.json').read_text())
          expected={'source_routes':192,'neighbors':64,'nwk_routes':128}
          for name,size in expected.items():
              observed=result['tables'][name]
              assert observed['status']=='HOSTED_NATIVE_LINKED', (name,observed)
              assert observed['linked_count']==size, (name,observed)
          assert result['b2_repository_sha']==__import__('os').environ['B1_SOURCE_SHA']
          print('EXACT TI ELF B2 P1 CAPACITIES:',expected)
          PY
          echo "Verify canonical F2 boot initializer and read-only SYS handler in compiled ELF"
          python - <<'PY'
          import json
          from pathlib import Path
          composite=json.loads(Path('/tmp/b0out/r4-composite-source.json').read_text())
          v4=composite['b4_v4_patch_evidence']
          Path('/tmp/b0out/b4-v4-native-receipt.json').write_text(json.dumps(v4,indent=2,sort_keys=True)+'\n')
          PY
          ELF_NAME="$(python -c "import json;print(json.load(open('/tmp/b0out/manifest.json'))['files']['elf']['file'])")"
          test -x "$TICLANG_ARMCOMPILER/bin/tiarmnm"
          python /tmp/r4-composite-sources/b4_v4_native_link_audit.py \
            --elf "/tmp/b0out/$ELF_NAME" --nm "$TICLANG_ARMCOMPILER/bin/tiarmnm" \
            --manifest /tmp/b0out/manifest.json \
            --v4-receipt /tmp/b0out/b4-v4-native-receipt.json \
            --output /tmp/b0out/b4-linked-f2-symbols.json
      - name: Upload native artifacts and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r4-stock20260311-native-${{ env.B1_SOURCE_SHA }}-${{ matrix.replica }}
          path: |
            /tmp/b0-provision-receipt.json
            /tmp/b0-sysconfig-binding.json
            /tmp/b0out/
          if-no-files-found: warn

  r4-b1-native-reproducibility:
    needs: [r4-b0-native-build, r4-b4-host-integration]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.B1_SOURCE_SHA }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: r4-stock20260311-native-${{ env.B1_SOURCE_SHA }}-1
          path: /tmp/b1-replica-1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: r4-stock20260311-native-${{ env.B1_SOURCE_SHA }}-2
          path: /tmp/b1-replica-2
      - name: Compare independent clean native replicas
        run: |
          python firmware/slzb-06p7u/r4/b1/tools/compare_native.py \
            --first /tmp/b1-replica-1/b0out --second /tmp/b1-replica-2/b0out \
            --expected-sha "$B1_SOURCE_SHA" --out /tmp/b1-native-reproducibility.json
      - name: Require deterministic FULL-NV4 FF-padded APP HEX across native replicas
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          roots=[Path('/tmp/b1-replica-%d/b0out/r4-full-nv4-app-only'%i) for i in (1,2)]
          digests=[]
          for root in roots:
              r=json.loads((root/'r4-full-nv4-app-only-receipt.json').read_text())
              assert r['image_class']=='STOCK20260311_APP_VECTOR_ZERO_UNBOOTABLE_UNTIL_SEPARATE_BOOT_HANDOFF'
              assert r['full_b0_b4_sealed'] is False and r['flash_authorized'] is False
              assert r['sectors_to_program']==len(r['application_sectors'])
              assert r['vector_last_program_order'][-1]=='0x00000'
              file=root/r['output_hex']
              assert hashlib.sha256(file.read_bytes()).hexdigest()==r['padded_hex_sha256']
              digests.append(r['padded_hex_sha256'])
          assert digests[0]==digests[1],digests
          print('TWO REAL FULL-NV4 NATIVE REPLICAS HAVE IDENTICAL FF-PADDED APP HEX',digests[0])
          PY
      - name: Require identical final reviewed TI source patchsets from both replicas
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          receipts=[]
          for index in (1,2):
              root=Path(f'/tmp/b1-replica-{index}/b0out')
              source=root/'r4-final-ti-source-manifest.json'
              patch=root/'r4-final-ti-source.patch'
              report=json.loads(source.read_bytes())
              assert report['schema']=='r4-p7u-final-ti-source-snapshot-v1'
              assert report['firmware_source_sha']==os.environ['B1_SOURCE_SHA']
              assert report['source_changed_files_count']>=10
              assert report['flash_authorized'] is False
              assert hashlib.sha256(patch.read_bytes()).hexdigest()==report['patch_sha256']
              receipts.append((source.read_bytes(),patch.read_bytes()))
          assert receipts[0]==receipts[1], 'Native replicas used different final TI source'
          print('FINAL PATCHSET AND MANIFEST BYTE-IDENTICAL ACROSS NATIVE REPLICAS')
          PY
      - name: Download same-run tested existing-owner host inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: r4-b4-host-integration-${{ env.B1_SOURCE_SHA }}
          path: /tmp/r4-current-host
      - name: Join CURRENT stock20260311 native APP, security ABI and compiled handoff
        run: |
          python - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def load(p): return json.loads(p.read_bytes())
          source=os.environ['B1_SOURCE_SHA']
          profile=Path('firmware/slzb-06p7u/r4/profiles/p7u-r4-stock20260311-nv4.json')
          profile_sha=sha(profile)
          expected={'trust_center_devices':300,'aps_table_entries':3,'associated_devices_slots':97,
                    'source_routes':192,'neighbors':64,'nwk_routes':128}
          replicas=[]
          abi_layouts=[]
          for index in (1,2):
              root=Path(f'/tmp/b1-replica-{index}/b0out')
              manifest=load(root/'manifest.json')
              image_hashes={k:manifest['files'][k]['sha256'] for k in ('elf','hex','bin','xml')}
              for kind,digest in image_hashes.items():
                  name=manifest['files'][kind]['file']
                  assert Path(name).name==name and sha(root/name)==digest
              seal=load(root/'b1-native-seal.json')
              assert seal['source_sha']==source and seal['replica']==str(index)
              assert seal['classification']=='HOSTED_NATIVE_LINKED_STOCK20260311_HANDOFF_REQUIRED'
              assert seal['nv4_region_base']=='0xA4000' and seal['boot_handoff_required'] is True
              assert seal['artifacts']==manifest['files']
              capacity=load(root/'r05-full-capacity-native-linked.json')
              assert capacity['profile_sha256']==profile_sha
              assert capacity['elf_sha256']==image_hashes['elf'] and capacity['xml_sha256']==image_hashes['xml']
              assert capacity['linked_c_irq_stack_bytes']==4096
              assert {k:v['linked_count'] for k,v in capacity['linked_capacity_symbols'].items()}==expected
              context=load(root/'rtos-context-native.json')
              assert context['status']=='M4F_CONTEXT_FRAME_AND_HWI_PATHS_AUDITED'
              assert context['stock20260311'] is True and context['native_artifact_sha256']==image_hashes
              assert context['native_manifest_sha256']==sha(root/'manifest.json')
              extracted=load(root/'r4-full-nv4-app-only/r4-full-nv4-app-only-receipt.json')
              assert extracted['source_native_manifest_sha256']==sha(root/'manifest.json')
              assert extracted['source_native_artifact_sha256']==image_hashes
              assert extracted['image_class']=='STOCK20260311_APP_VECTOR_ZERO_UNBOOTABLE_UNTIL_SEPARATE_BOOT_HANDOFF'
              assert extracted['protected_nv4']==['0xA4000','0xAC000']
              assert extracted['vector_last_program_order'][-1]=='0x00000'
              assert extracted['flash_authorized'] is False
              abi=load(root/'security-native-abi.json')
              assert abi['schema']=='p7u-security-native-abi-v1' and abi['source_sha']==source
              assert abi['profile_sha256']==profile_sha and abi['native_manifest_sha256']==sha(root/'manifest.json')
              assert abi['native_elf_sha256']==image_hashes['elf']
              abi_layouts.append((abi['structs'],abi['constants']))
              handoff=load(root/'boot-handoff/handoff-receipt.json')
              assert handoff['schema']=='r4-p7u-stock20260311-compiled-handoff-v1'
              assert handoff['status']=='COMPILED_M4F_SINGLE_SECTOR_TRANSFER_AUDITED'
              assert handoff['source_native_manifest_sha256']==sha(root/'manifest.json')
              assert handoff['source_native_artifact_sha256']==image_hashes and handoff['profile_sha256']==profile_sha
              assert handoff['flash_authorized'] is False and handoff['hardware_boot_qualified'] is False
              assert handoff['sector_bytes']==8192 and handoff['stage_sector_range']==['0xac000','0xae000']
              sector=root/'boot-handoff'/handoff['sector_bin']
              assert Path(handoff['sector_bin']).name==handoff['sector_bin'] and sha(sector)==handoff['sector_sha256']
              app=root/'r4-full-nv4-app-only'/extracted['output_hex']
              assert sha(app)==extracted['padded_hex_sha256']
              replicas.append({'replica':index,'manifest_sha256':sha(root/'manifest.json'),'artifacts':image_hashes,
                               'app_hex_sha256':sha(app),'handoff_sha256':sha(sector),'abi_sha256':sha(root/'security-native-abi.json')})
          assert replicas[0]['app_hex_sha256']==replicas[1]['app_hex_sha256']
          assert replicas[0]['handoff_sha256']==replicas[1]['handoff_sha256']
          assert abi_layouts[0]==abi_layouts[1], 'Native serialized security layouts differ'
          reproducibility=load(Path('/tmp/b1-native-reproducibility.json'))
          assert reproducibility['source_sha']==source and reproducibility['stock20260311'] is True
          assert reproducibility['result']=='TWO_CLEAN_NATIVE_BUILDS_BYTE_IDENTICAL'
          host_root=Path('/tmp/r4-current-host')
          host=load(host_root/'host-integration-receipt.json')
          assert host['schema']=='r4-b4-host-integration-v1'
          assert host['source_sha']==source and host['status']=='HOSTED_SOURCE_COMPILED_AND_SYNTHETIC_TESTED'
          assert host['existing_owner_only'] is True and host['default_enabled'] is False
          assert host['retained_startup_protected'] is True
          assert host['automatic_backup_restore'] is False
          assert host['host_upstream_sha']=='6ceb6f6714db26b7fd2c33c53e0d40e29eb95e88'
          assert host['herdsman_sha']=='0968f979d558874b17396c96b66382d4236bbdcd'
          assert host['z2m_sha']=='62b02e2aa1997c574223b80c196677b63a25f4a7'
          for name,item in host['files'].items():
              assert Path(name).name==name and sha(host_root/name)==item['sha256']
          first=Path('/tmp/b1-replica-1/b0out')
          out=Path('/tmp/p7u-stock20260311-candidate');out.mkdir()
          extracted=load(first/'r4-full-nv4-app-only/r4-full-nv4-app-only-receipt.json')
          handoff=load(first/'boot-handoff/handoff-receipt.json')
          shutil.copyfile(first/'r4-full-nv4-app-only'/extracted['output_hex'],out/'P7U-STOCK20260311-APP-ONLY.hex')
          shutil.copyfile(first/'boot-handoff'/handoff['sector_bin'],out/'P7U-STOCK20260311-AC000-HANDOFF.bin')
          shutil.copyfile(first/'boot-handoff/handoff-receipt.json',out/'handoff-receipt.json')
          shutil.copyfile(profile,out/'profile.json')
          shutil.copyfile('firmware/slzb-06p7u/r4/release/R4_P7U_STOCK20260311_FINALIZATION.md',out/'START_HERE.md')
          shutil.copyfile('/tmp/b1-native-reproducibility.json',out/'reproducibility.json')
          for name in ('security-native-abi.json','security-reader.c','security-reader-linux',
                       'r05-full-capacity-native-linked.json','rtos-context-native.json',
                       'b1-native-seal.json','r4-final-ti-source.patch','r4-final-ti-source-manifest.json'):
              shutil.copyfile(first/name,out/name)
          shutil.copyfile(first/'r4-full-nv4-app-only/r4-full-nv4-app-only-receipt.json',out/'app-only-receipt.json')
          shutil.copytree(host_root,out/'host')
          native=out/'native';native.mkdir()
          shutil.copyfile(first/'manifest.json',native/'manifest.json')
          shutil.copyfile(first/'build.log',native/'build.log')
          manifest=load(first/'manifest.json')
          for item in manifest['files'].values(): shutil.copyfile(first/item['file'],native/item['file'])
          receipt={'schema':'p7u-stock20260311-candidate-v1','source_sha':source,
                   'profile_sha256':profile_sha,'native_manifest_sha256':replicas[0]['manifest_sha256'],
                   'app_hex_sha256':replicas[0]['app_hex_sha256'],'handoff_sha256':replicas[0]['handoff_sha256'],
                   'board':'SLZB-06P7U-r1.73-CC2652P7','github_run_id':os.environ['GITHUB_RUN_ID'],
                   'replicas':replicas,'factory_ccfg_image_valid_conf':'0xAC000',
                   'boot_contract':'APP0_REQUIRES_SEPARATE_AC000_HANDOFF',
                   'private_current_capture_and_security_preflight_required':True,
                   'full_b0_b4_sealed':False,'hardware_boot_qualified':False,'flash_authorized':False,
                   'files':{p.relative_to(out).as_posix():sha(p) for p in sorted(out.rglob('*')) if p.is_file()}}
          (out/'candidate.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print('CANDIDATE_CANONICAL_SHA256='+hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest())
          print('CURRENT STOCK20260311 ENGINEERING CANDIDATE; PRIVATE BINDING AND AUTHORIZATION STILL REQUIRED',source)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p7u-stock20260311-candidate-${{ env.B1_SOURCE_SHA }}
          path: /tmp/p7u-stock20260311-candidate/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r4-stock20260311-reproducibility-${{ env.B1_SOURCE_SHA }}
          path: /tmp/b1-native-reproducibility.json
          if-no-files-found: error
