name: P7U CURRENT stock20260311 B0-B4 dual native (BOOT HANDOFF REQUIRED)

on:
  pull_request:
    paths:
      - '.github/workflows/test-r4-stock20260311-native.yml'
      - '.github/workflows/test-r4-b4-host.yml'
      - 'firmware/slzb-06p7u/r4/**'
      - 'tools/r4_*.py'
      - 'tools/r4_f2_owned_core.c'
      - 'host/r4-b4/**'
      - 'host/recovery/**'
      - 'tests/test_r4_*.py'
      - 'tests/test_p7u_stock20260311_*.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  B1_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  r4-b4-host-integration:
    uses: ./.github/workflows/test-r4-b4-host.yml

  r4-b1-admission-source:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Guard NV4/TC300 against all TI legacy format migrations
        run: python -m unittest -v tests.test_r4_t6_migration_guard
      - name: Current layout, security, handoff and retained historical regression controls
        run: python -m unittest -v tests.test_r4_stock20260311_native tests.test_r4_stock20260311_handoff tests.test_r4_stock20260311_transition tests.test_p7u_stock20260311_security_preflight tests.test_p7u_stock20260311_security_abi tests.test_r4_t6_full_capacity tests.test_r4_m4f_asm_preprocessing tests.test_r4_final_source_snapshot tests.test_r4_full_nv4_app_only
      - name: Compile pinned actual TI bodies and execute fault and mutation controls
        run: python firmware/slzb-06p7u/r4/b1/tools/run_hosted_tests.py --out /tmp/b1-hosted
      - name: Pinned four-page TI NVOCMP logical-end, CRC/status and collision mutants
        run: |
          python -m unittest -v tests.test_r4_nv4_readonly_admission
          python -m unittest -v tests.test_r4_nv4_b1_bridge
          python -m unittest -v tests.test_r4_nv4_native_seal
          python -m unittest -v tests.test_r4_b1_compare_native_nv4
      - name: Upload exact-source synthetic receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: b1-direct-source-${{ env.B1_SOURCE_SHA }}
          path: |
            /tmp/b1-hosted/overlay.json
            /tmp/b1-hosted/test-results.json
          if-no-files-found: warn

  r4-b0-overlay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Checkout push SHA
        if: github.event_name != 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Compile R4-B0 tools and tests
        run: |
          python -m py_compile firmware/slzb-06p7u/r4/b0/tools/b0_overlay_validate.py firmware/slzb-06p7u/r4/b0/tools/b0_image_audit.py firmware/slzb-06p7u/r4/b0/tools/b0_provision.py firmware/slzb-06p7u/r4/b0/tools/b0_collect_native.py firmware/slzb-06p7u/r4/b0/tools/b0_fetch_ti.py firmware/slzb-06p7u/r4/b0/tools/b0_install_ti.py firmware/slzb-06p7u/r4/b0/tools/b0_sdk_build_scope.py firmware/slzb-06p7u/r4/b0/tools/b0_bind_sysconfig.py tests/test_r4_b0_bind_sysconfig.py firmware/slzb-06p7u/r4/b0/tools/b0_p7u_board_overlay.py tests/test_r4_b0_p7u_board_overlay.py firmware/slzb-06p7u/r4/b0/tools/b0_verify_generated_board.py tests/test_r4_b0_verify_generated_board.py tests/test_r4_b0_fetch_ti.py tests/test_r4_b0_install_ti.py tests/test_r4_b0_overlay.py tests/test_r4_b0_audit.py tests/test_r4_b0_collect_native.py tests/test_r4_b0_sdk_build_scope.py
      - name: Assert R4-B0 fixture LF pin holds (CRLF drift guard)
        run: |
          test -f firmware/slzb-06p7u/r4/b0/fixtures/.gitattributes
          grep -q "eol=lf" firmware/slzb-06p7u/r4/b0/fixtures/.gitattributes
          git ls-files --eol firmware/slzb-06p7u/r4/b0/fixtures/ | tee /tmp/b0eol.txt
          if grep -E '^i/(mixed|crlf)|w/crlf' /tmp/b0eol.txt; then
            echo "R4-B0 fixtures have CRLF drift; text vectors must stay LF for the sha256 binding"
            exit 1
          fi
          echo "R4-B0 fixture LF pin holds"
      - name: Run R4-B0 overlay tests
        run: python -m unittest -v tests.test_r4_b0_overlay
      - name: Run R4-B0 image audit tests and seven NV/CCFG erase-denial cases
        run: |
          python -m unittest -v tests.test_r4_b0_audit
          python -m unittest -v tests.test_r4_b0_sector_erase_denial
      - name: Adversarial P7U app-sector and private duplicate-backup controls (synthetic only)
        run: python -m unittest -v tests.test_r4_flash_preflight
      - name: Exact-anchor resident boot preservation and NVS relocation hostile controls
        run: |
          python -m unittest -v tests.test_r4_preserve_resident_boot_nvs
          python -m unittest -v tests.test_r4_package_resident_app
          python -m unittest -v tests.test_r4_prepare_direct_rom_boot
          python -m unittest -v tests.test_r4_make_direct_app_only
          python -m unittest -v tests.test_r4_make_rom_handoff_sector
          python -m unittest -v tests.test_r4_boot_sector_transaction
          python -m unittest -v tests.test_r4_fitted_native_direct_ccfg_offline
          python -m unittest -v tests.test_r4_fitted_ccfg_source_differential
          python -m unittest -v tests.test_r4_direct_ccfg_offline_plan
      - name: P7U fitted MCUboot signature verification and adversarial denial (synthetic only)
        run: |
          python -m pip install cryptography==44.0.2
          python -m unittest -v tests.test_r4_verify_mcuboot_signed_image
      - name: Test strict native artifact collector (synthetic test only)
        run: python -m unittest -v tests.test_r4_b0_collect_native
      - name: Test SHA-gated TI toolchain acquisition (offline)
        run: python -m unittest -v tests.test_r4_b0_fetch_ti
      - name: Test TI installer archive safety (offline)
        run: python -m unittest -v tests.test_r4_b0_install_ti
      - name: Test target-scoped SDK M4F build workaround
        run: python -m unittest -v tests.test_r4_b0_sdk_build_scope
      - name: Test pinned CCS SysConfig version dispatch
        run: python -m unittest -v tests.test_r4_b0_bind_sysconfig
      - name: Test measured P7U pinout and CCFG source overlay
        run: python -m unittest -v tests.test_r4_b0_p7u_board_overlay
      - name: Test exact TI Clang version banner and reject substring impostors
        run: python -m unittest -v tests.test_r4_b0_provision_versions
      - name: Test generated P7U UART and whole-CFG audit negative controls
        run: python -m unittest -v tests.test_r4_b0_verify_generated_board
      - name: Validate real B0 overlay documents
        run: python firmware/slzb-06p7u/r4/b0/tools/b0_overlay_validate.py validate firmware/slzb-06p7u/r4/b0
      - name: Unit oracle sanity on valid vector (NOT native proof)
        run: python firmware/slzb-06p7u/r4/b0/tools/b0_image_audit.py audit firmware/slzb-06p7u/r4/b0 --artifacts firmware/slzb-06p7u/r4/b0/fixtures/artifacts-valid --synthetic-fixture-oracle
      - name: Negative control (o1) corrupted image must fail hash binding
        run: |
          if out=$(python firmware/slzb-06p7u/r4/b0/tools/b0_image_audit.py audit firmware/slzb-06p7u/r4/b0 --artifacts firmware/slzb-06p7u/r4/b0/fixtures/artifacts-bad-hash --synthetic-fixture-oracle 2>&1); then
            echo "control (o1) unexpectedly passed"
            exit 1
          fi
          echo "$out" | grep -F "sha256 mismatch"
          echo "control (o1) rejected at hash binding as required"
      - name: Negative control (o2) echo-pass log must fail linker evidence
        run: |
          if out=$(python firmware/slzb-06p7u/r4/b0/tools/b0_image_audit.py audit firmware/slzb-06p7u/r4/b0 --artifacts firmware/slzb-06p7u/r4/b0/fixtures/artifacts-no-link --synthetic-fixture-oracle 2>&1); then
            echo "control (o2) unexpectedly passed"
            exit 1
          fi
          echo "$out" | grep -F "no actual linker invocation"
          echo "control (o2) rejected at linker evidence as required"
      - name: Negative control (o3) NV-CCFG overlap must fail
        run: |
          if out=$(python firmware/slzb-06p7u/r4/b0/tools/b0_image_audit.py audit firmware/slzb-06p7u/r4/b0 --artifacts firmware/slzb-06p7u/r4/b0/fixtures/artifacts-overlap --synthetic-fixture-oracle 2>&1); then
            echo "control (o3) unexpectedly passed"
            exit 1
          fi
          echo "$out" | grep -F "NV/CCFG overlap"
          echo "control (o3) rejected at NV/CCFG separation as required"
      - name: Negative control (o4) baud mutation must fail overlay
        run: |
          rm -rf /tmp/b0neg_baud
          cp -r firmware/slzb-06p7u/r4/b0 /tmp/b0neg_baud
          python -c "import json; p='/tmp/b0neg_baud/B0_BOARD_CONTRACT.json'; d=json.load(open(p)); [c.__setitem__('value',9600) for c in d['claims'] if c['id']=='uart-baud']; json.dump(d,open(p,'w'),indent=1)"
          if out=$(python firmware/slzb-06p7u/r4/b0/tools/b0_overlay_validate.py validate /tmp/b0neg_baud 2>&1); then
            echo "control (o4) unexpectedly passed"
            exit 1
          fi
          echo "$out" | grep -F "uart-baud"
          echo "control (o4) rejected at board contract as required"
      - name: Negative control (o5) absent artifacts must BLOCK, never pass
        run: |
          if out=$(python firmware/slzb-06p7u/r4/b0/tools/b0_image_audit.py audit firmware/slzb-06p7u/r4/b0 --artifacts firmware/slzb-06p7u/r4/b0/fixtures/artifacts-does-not-exist --synthetic-fixture-oracle 2>&1); then
            echo "control (o5) unexpectedly passed"
            exit 1
          fi
          echo "$out" | grep -F "B0-AUDIT-BLOCKED"
          echo "control (o5) blocked without binary claim as required"
      - name: Negative control (o6) fake ELF must fail ELF gate
        run: |
          if out=$(python firmware/slzb-06p7u/r4/b0/tools/b0_image_audit.py audit firmware/slzb-06p7u/r4/b0 --artifacts firmware/slzb-06p7u/r4/b0/fixtures/artifacts-fake-elf --synthetic-fixture-oracle 2>&1); then
            echo "control (o6) unexpectedly passed"
            exit 1
          fi
          echo "$out" | grep -F "ELF"
          echo "control (o6) rejected fake ELF as required"
      - name: Negative control (o7) path traversal must fail confined
        run: |
          if out=$(python firmware/slzb-06p7u/r4/b0/tools/b0_image_audit.py audit firmware/slzb-06p7u/r4/b0 --artifacts firmware/slzb-06p7u/r4/b0/fixtures/artifacts-path-traversal --synthetic-fixture-oracle 2>&1); then
            echo "control (o7) unexpectedly passed"
            exit 1
          fi
          echo "$out" | grep -F "traversal"
          echo "control (o7) rejected path traversal as required"
      - name: Negative control (o8) synthetic map format must fail
        run: |
          if out=$(python firmware/slzb-06p7u/r4/b0/tools/b0_image_audit.py audit firmware/slzb-06p7u/r4/b0 --artifacts firmware/slzb-06p7u/r4/b0/fixtures/artifacts-synthetic-map --synthetic-fixture-oracle 2>&1); then
            echo "control (o8) unexpectedly passed"
            exit 1
          fi
          echo "$out" | grep -F "synthetic"
          echo "control (o8) rejected synthetic map format as required"
      - name: Negative control (o9) unhashable board claim id must fail without traceback
        run: |
          rm -rf /tmp/b0neg_ids
          cp -r firmware/slzb-06p7u/r4/b0 /tmp/b0neg_ids
          python -c "import json; p='/tmp/b0neg_ids/B0_BOARD_CONTRACT.json'; d=json.load(open(p)); d['claims'].append({'id':['uart-rx'],'value':'DIO12'}); json.dump(d,open(p,'w'),indent=1)"
          if out=$(python firmware/slzb-06p7u/r4/b0/tools/b0_overlay_validate.py validate /tmp/b0neg_ids 2>&1); then
            echo "control (o9) unexpectedly passed"
            exit 1
          fi
          echo "$out" | grep -F "nonempty string"
          if echo "$out" | grep -F "Traceback"; then
            echo "control (o9) leaked a traceback"
            exit 1
          fi
          echo "control (o9) rejected unhashable claim id as required"
      - name: Negative control (o10) tampered HEX/BIN with updated digests must fail cross-binding
        run: |
          if out=$(python firmware/slzb-06p7u/r4/b0/tools/b0_image_audit.py audit firmware/slzb-06p7u/r4/b0 --artifacts firmware/slzb-06p7u/r4/b0/fixtures/artifacts-tampered-hexbin --synthetic-fixture-oracle 2>&1); then
            echo "control (o10) unexpectedly passed"
            exit 1
          fi
          echo "$out" | grep -F "cross-binding"
          if echo "$out" | grep -F "sha256 mismatch"; then
            echo "control (o10) failed at hash only, cross-binding bypassed"
            exit 1
          fi
          if echo "$out" | grep -F "Traceback"; then
            echo "control (o10) leaked a traceback"
            exit 1
          fi
          echo "control (o10) rejected at HEX/BIN cross-binding as required"
      - name: Negative control (o11) injected SRAM bytes must fail content-binding
        run: |
          if out=$(python firmware/slzb-06p7u/r4/b0/tools/b0_image_audit.py audit firmware/slzb-06p7u/r4/b0 --artifacts firmware/slzb-06p7u/r4/b0/fixtures/artifacts-extra-bytes --synthetic-fixture-oracle 2>&1); then
            echo "control (o11) unexpectedly passed"
            exit 1
          fi
          echo "$out" | grep -F "content-binding"
          echo "$out" | grep -F "no covering ELF PT_LOAD segment"
          if echo "$out" | grep -F "sha256 mismatch"; then
            echo "control (o11) failed at hash only, content-binding bypassed"
            exit 1
          fi
          if echo "$out" | grep -F "Traceback"; then
            echo "control (o11) leaked a traceback"
            exit 1
          fi
          echo "control (o11) rejected injected bytes at content-binding as required"
      - name: Negative control (o12) deviant FLASH geometry must fail donor pin
        run: |
          if out=$(python firmware/slzb-06p7u/r4/b0/tools/b0_image_audit.py audit firmware/slzb-06p7u/r4/b0 --artifacts firmware/slzb-06p7u/r4/b0/fixtures/artifacts-bad-geometry --synthetic-fixture-oracle 2>&1); then
            echo "control (o12) unexpectedly passed"
            exit 1
          fi
          echo "$out" | grep -F "geometry mismatch"
          if echo "$out" | grep -F "Traceback"; then
            echo "control (o12) leaked a traceback"
            exit 1
          fi
          echo "control (o12) rejected deviant FLASH geometry as required"
      - name: Negative control (o13) fabricated one-line log must fail log tripwire
        run: |
          if out=$(python firmware/slzb-06p7u/r4/b0/tools/b0_image_audit.py audit firmware/slzb-06p7u/r4/b0 --artifacts firmware/slzb-06p7u/r4/b0/fixtures/artifacts-fake-log --synthetic-fixture-oracle 2>&1); then
            echo "control (o13) unexpectedly passed"
            exit 1
          fi
          echo "$out" | grep -F "no actual linker invocation"
          if echo "$out" | grep -F "Traceback"; then
            echo "control (o13) leaked a traceback"
            exit 1
          fi
          echo "control (o13) rejected fabricated one-line log as required"

  r4-b0-upstream-inventory:
    runs-on: ubuntu-latest
    env:
      EXPECT_TI_SDK_SHA: 3615ad5d3f4f271258d18a2f5ce1785064ff9a58
      EXPECT_TI_EXAMPLES_SHA: 87ff5b638b632050228a7504f35cf3b95581c278
      EXPECT_TI_RELEASE: lpf2-8.33.00.16
    steps:
      - name: Checkout pull request head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Checkout push SHA
        if: github.event_name != 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      # Re-derives every donor file name in B0_DONOR_INVENTORY.json
      # against upstream at the pinned SHAs. Any invented or renamed
      # path fails here. Fails closed on network outage (fetch
      # failure is nonzero with `external proof unavailable`, never
      # a pass).
      - name: Verify donor pins and exact upstream file names
        run: |
          set -e
          rm -rf /tmp/b0donor && mkdir -p /tmp/b0donor && cd /tmp/b0donor
          git init -q examples && (cd examples && git remote add origin https://github.com/TexasInstruments/simplelink-zstack-examples.git && git fetch --depth 1 origin "$EXPECT_TI_EXAMPLES_SHA" || { echo "external proof unavailable (fetch of zstack-examples failed)"; exit 1; })
          [ "$(cd examples && git rev-parse FETCH_HEAD)" = "$EXPECT_TI_EXAMPLES_SHA" ] || { echo "upstream mismatch (examples SHA)"; exit 1; }
          echo "upstream OK: fetched zstack-examples $EXPECT_TI_EXAMPLES_SHA"
          git init -q sdk && (cd sdk && git remote add origin https://github.com/TexasInstruments/simplelink-lowpower-f2-sdk.git && git fetch --depth 1 origin "$EXPECT_TI_SDK_SHA" || { echo "external proof unavailable (fetch of lowpower-f2-sdk failed)"; exit 1; })
          [ "$(cd sdk && git rev-parse FETCH_HEAD)" = "$EXPECT_TI_SDK_SHA" ] || { echo "upstream mismatch (SDK SHA)"; exit 1; }
          echo "upstream OK: fetched lowpower-f2-sdk $EXPECT_TI_SDK_SHA"
          (cd examples && git ls-tree "$EXPECT_TI_EXAMPLES_SHA" cc13xx_cc26xx_sdk | grep -F "160000 commit $EXPECT_TI_SDK_SHA") || { echo "upstream mismatch (cc13xx_cc26xx_sdk gitlink)"; exit 1; }
          echo "upstream OK: cc13xx_cc26xx_sdk gitlink mode 160000 equals SDK pin"
          (cd sdk && git log -1 --format=%s "$EXPECT_TI_SDK_SHA" | grep -F "$EXPECT_TI_RELEASE") || { echo "upstream mismatch (SDK commit message release)"; exit 1; }
          echo "upstream OK: SDK commit message names $EXPECT_TI_RELEASE"
          for p in \
            "examples/rtos/LP_CC1352P7_4/zstack/znp/tirtos7/ticlang/znp_LP_CC1352P7_4_tirtos7_ticlang.projectspec" \
            "examples/rtos/LP_CC1352P7_4/zstack/znp/tirtos7/znp.syscfg" \
            "README.md"; do
            (cd examples && git ls-tree "$EXPECT_TI_EXAMPLES_SHA" "$p" | grep -F "$p") || { echo "upstream mismatch (missing examples path: $p)"; exit 1; }
            echo "upstream OK: examples path present: $p"
          done
          for p in \
            "source/ti/zstack/startup/main.c" \
            "source/ti/zstack/npi/npi_task.c" \
            "source/ti/zstack/mt/mt_sys.c" \
            "source/ti/zstack/boards/cc13x2x7_cc26x2x7/cc13x2x7_cc26x2x7_tirtos7_ticlang.cmd" \
            "source/ti/devices/cc13x2x7_cc26x2x7/startup_files/startup_ticlang.c"; do
            (cd sdk && git ls-tree "$EXPECT_TI_SDK_SHA" "$p" | grep -F "$p") || { echo "upstream mismatch (missing SDK path: $p)"; exit 1; }
            echo "upstream OK: SDK path present: $p"
          done
          echo "B0 donor inventory attested upstream"
      - name: Negative control (i1) bogus SHA must fail fetch closed
        run: |
          rm -rf /tmp/b0neg_i1 && mkdir -p /tmp/b0neg_i1 && cd /tmp/b0neg_i1
          git init -q neg && (cd neg && git remote add origin https://github.com/TexasInstruments/simplelink-zstack-examples.git && git fetch --depth 1 origin 0000000000000000000000000000000000000000 2>/dev/null) && { echo "control (i1) unexpectedly fetched"; exit 1; }
          echo "control (i1) fetch refused as required (external proof unavailable, never a pass)"
      - name: Negative control (i2) invented path must fail ls-tree
        run: |
          cd /tmp/b0donor/examples
          if git ls-tree "$EXPECT_TI_EXAMPLES_SHA" "examples/rtos/LP_CC1352P7_4/zstack/znp/tirtos7/znp_CC1352P7_4_tirtos7_ticlang.projectspec" | grep -F "znp_CC1352P7_4"; then
            echo "control (i2) unexpectedly found invented path"
            exit 1
          fi
          echo "control (i2) invented P7 projectspec name absent upstream as required (real name is znp_LP_CC1352P7_4_tirtos7_ticlang.projectspec)"

  r4-b0-native-build:
    # Fail closed: a red SDK/board overlay or unverified TI donor blocks native promotion.
    needs: [r4-b1-admission-source, r4-b0-overlay, r4-b0-upstream-inventory]
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    env:
      B1_NATIVE_REPLICA: ${{ matrix.replica }}
    concurrency:
      group: r4-stock20260311-native-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ matrix.replica }}
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout pull request head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Checkout push SHA
        if: github.event_name != 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Pinned emulator for compiled boot-handoff qualification
        run: python -m pip install unicorn==2.1.4
      # Fail-closed provision gate: with no verified TI toolchain
      # distribution provisioned, this emits a BLOCKED receipt and
      # fails the job. It never fabricates ELF/HEX/BIN and never
      # reports a build PASS. SysConfig 1.21.1.3772 must be present
      # as an explicit standalone install: CCS 12.8 bundles only
      # 1.21.0.3721, which never satisfies the pin. When the
      # toolchain becomes available, the READY branch below performs
      # the real CCS headless build. Fixture vectors in
      # firmware/slzb-06p7u/r4/b0/fixtures/ are unit oracle sanity
      # inputs only and are NEVER audited here as native proof.
      - name: Restore checksum-pinned TI distribution cache
        id: ti_archive_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/b0ti/downloads
          key: r4-b0-ti-linux-ccs-fa807c9e-syscfg-0c1674f8-clang-2864bb10
      - name: Install TI ARM Clang Linux runtime dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libtinfo5
          ldconfig -p | grep -F 'libtinfo.so.5'
      - name: Authenticated TI bootstrap (hash pins required)
        env:
          TI_CCS_SHA256: ${{ secrets.TI_CCS_SHA256 }}
