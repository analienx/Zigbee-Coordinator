name: PR44 independent review counterexamples
on:
  push:
    branches: [codex/t832-r8-review-20261006]
permissions:
  contents: read
jobs:
  counterexamples:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: repo}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TexasInstruments/simplelink-lowpower-f2-sdk
          ref: 6499c3f53fc5fb5806213be695450a7b43fbaf3d
          path: sdk
          sparse-checkout: source/ti/common/nv
      - name: Reproduce adverse review cases against PR44 source
        run: |
          python3 -m pip install --quiet capstone==5.0.6
          python3 repo/review/pr44_counterexamples.py --sdk sdk --out review-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pr44-review-counterexamples
          path: |
            review-evidence/*counterexample*.json
            review-evidence/driver/production_assert/unknown-topology.bin
          if-no-files-found: error
