name: P7U stock20260311 bounded ROM adapter (NO HARDWARE)

on:
  push:
    branches:
      - codex/p7u-r4-review-fixes-20261018
    paths:
      - '.github/workflows/p7u-stock20260311-rom-adapter.yml'
      - 'firmware/slzb-06p7u/r4/release/rom_writer/**'
      - 'tests/test_p7u_stock20260311_rom_adapter.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact pushed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Run bounded transport and forbidden-write controls
        shell: bash
        run: python -m unittest discover -s tests -p test_p7u_stock20260311_rom_adapter.py -v
