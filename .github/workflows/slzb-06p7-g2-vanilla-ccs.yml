name: SLZB-06P7 G2 real vanilla TI CCS ZNP (REFERENCE ONLY)
# PR checks remain visible through the connected GitHub Actions interface.
# Superseded jobs are cancelled; documentation-only run efficiency is handled
# separately from the correctness-critical build and binary attestation.
on:
  pull_request:
    paths:
      - '.github/workflows/slzb-06p7-g2-vanilla-ccs.yml'
      - 'firmware/slzb-06p7/ti832/g2/**'
      - 'firmware/slzb-06p7/ti832/g3/**'
      - 'firmware/slzb-06p7/ti832/g4/**'
      - 'firmware/slzb-06p7/ti832/board/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  classify_delta:
    name: Decide if real native CCS rebuild is warranted
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      requires_native: ${{ steps.check.outputs.requires_native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fail-safe source delta analysis
        id: check
        shell: bash
        env:
          # pull_request/workflow_dispatch payloads have no top-level
          # before/after (push-only fields); use the PR base/head SHAs so
          # the delta gate compares real commits instead of always
          # failing open on empty strings. workflow_dispatch stays empty
          # and therefore fail-open (native build required).
          BEFORE: ${{ github.event.pull_request.base.sha }}
          AFTER: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          python3 firmware/slzb-06p7/ti832/g3/ci_delta_gate.py \
            --repo . --before "$BEFORE" --after "$AFTER" \
            --event "$GITHUB_EVENT_NAME" --action "$ACTION" \
            --out "$RUNNER_TEMP/p7-delta.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"p7-delta.json").read_text())
          need="true" if d["native_required"] else "false"
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"requires_native={need}\n")
          print("P7_NATIVE_REBUILD",need,d["reason"])
          PY
  source-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: G2 source-only negative tests
        run: |
          set -euo pipefail
          python3 -m py_compile firmware/slzb-06p7/ti832/g2/verify_vanilla.py
          python3 firmware/slzb-06p7/ti832/g2/verify_vanilla.py selftest
          python3 -m py_compile firmware/slzb-06p7/ti832/g2/validate_elf_hex.py
          python3 firmware/slzb-06p7/ti832/g2/validate_elf_hex.py --selftest
          python3 firmware/slzb-06p7/ti832/board/verify_g1.py --selftest
          python3 -m py_compile firmware/slzb-06p7/ti832/g3/analyze_memory.py
          python3 firmware/slzb-06p7/ti832/g3/analyze_memory.py --selftest
          python3 -m py_compile firmware/slzb-06p7/ti832/g3/fix_uart_pointer_types.py
          python3 firmware/slzb-06p7/ti832/g3/fix_uart_pointer_types.py --selftest
          python3 -m py_compile firmware/slzb-06p7/ti832/g3/validate_hardware_gate.py
          python3 firmware/slzb-06p7/ti832/g3/validate_hardware_gate.py --selftest
          python3 -m py_compile firmware/slzb-06p7/ti832/g3/verify_toolchain_lock.py
          python3 firmware/slzb-06p7/ti832/g3/verify_toolchain_lock.py --selftest
          python3 -m py_compile firmware/slzb-06p7/ti832/g3/ci_delta_gate.py
          python3 firmware/slzb-06p7/ti832/g3/ci_delta_gate.py --selftest
          python3 -m py_compile firmware/slzb-06p7/ti832/g3/nv5_layout.py
          python3 firmware/slzb-06p7/ti832/g3/nv5_layout.py --selftest
          python3 -m py_compile firmware/slzb-06p7/ti832/g3/nv5_verify_linked.py
          python3 firmware/slzb-06p7/ti832/g3/nv5_verify_linked.py --selftest
          python3 -m py_compile firmware/slzb-06p7/ti832/g3/nv5_effective.py
          python3 firmware/slzb-06p7/ti832/g3/nv5_effective.py --selftest
          python3 -m py_compile firmware/slzb-06p7/ti832/g4/cap192_capacity.py
          python3 firmware/slzb-06p7/ti832/g4/cap192_capacity.py --selftest
  native-ti-ccs:
    name: Actual CCS 12.8 P7 vanilla ARM-M4F ELF/HEX/MAP
    needs: [source-tests, classify_delta]
    if: needs.classify_delta.outputs.requires_native == 'true'
    concurrency:
      group: slzb-p7-g2-native-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: repo
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TexasInstruments/simplelink-lowpower-f2-sdk
          ref: 6499c3f53fc5fb5806213be695450a7b43fbaf3d
          path: sdk
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TexasInstruments/simplelink-zstack-examples
          ref: 87ff5b638b632050228a7504f35cf3b95581c278
          path: examples
          persist-credentials: false
      - name: Freeze pristine TI source BEFORE build or import
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-evidence
          test "$(git -C repo rev-parse HEAD)" = "$GITHUB_SHA"
          python3 repo/firmware/slzb-06p7/ti832/g2/verify_vanilla.py preflight \
            --sdk sdk --examples examples --out build-evidence/pristine-ti-source.json
          git -C sdk diff --exit-code HEAD
          git -C examples diff --exit-code HEAD
      - name: Install actual CCS12.8 vendor toolchain and SysConfig 1.21.1
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl tar xz-utils cmake \
            libc6-i386 libusb-0.1-4 libncurses5 libtinfo5 \
            libx11-6 libxext6 libxrender1 libxtst6 libxi6 libxt6 libxinerama1 \
            libgtk2.0-0 libnss3 xvfb
          mkdir -p "$HOME/ti/downloads"
          cd "$HOME/ti/downloads"
          FILE=CCS12.8.0.00012_web_linux-x64.tar.gz
          curl -fL --retry 5 --retry-delay 2 -o "$FILE" \
            "https://dr-download.ti.com/software-development/ide-configuration-compiler-or-debugger/MD-J1VdearkvK/12.8.0/$FILE"
          python3 "$GITHUB_WORKSPACE/repo/firmware/slzb-06p7/ti832/g3/verify_toolchain_lock.py" \
            --name ccs --download "$PWD/$FILE"
          tar xzf "$FILE"
          SETUP=$(find . -maxdepth 3 -type f -name ccs_setup_12.8.0.00012.run -print -quit)
          test -n "$SETUP"
          chmod +x "$SETUP"
          "$SETUP" --mode unattended --enable-components PF_WCONN --prefix "$HOME/ti/ccs1280"
          FILE=sysconfig-1.21.1_3772-setup.run
          curl -fL --retry 5 --retry-delay 2 -o "$FILE" \
            "https://software-dl.ti.com/ccs/esd/sysconfig/$FILE"
          python3 "$GITHUB_WORKSPACE/repo/firmware/slzb-06p7/ti832/g3/verify_toolchain_lock.py" \
            --name sysconfig --download "$PWD/$FILE"
          chmod +x "$FILE"
          "./$FILE" --mode unattended --prefix "$HOME/ti/sysconfig_1.21.1"
          # Installer bytes are observed before any future checksum pinning.
          # This is NOT an independent TI-published checksum validation.
          sha256sum CCS12.8.0.00012_web_linux-x64.tar.gz \
                    sysconfig-1.21.1_3772-setup.run | \
            tee "$GITHUB_WORKSPACE/build-evidence/vendor-installer-sha256.txt"
      - name: Pin actual compiler versions and activate SysConfig 1.21.1
        shell: bash
        run: |
          set -euo pipefail
          TIARMCLANG=$(find "$HOME/ti/ccs1280" -type f -name tiarmclang -perm -u+x -print -quit)
          SYSCONFIG=$(find "$HOME/ti/sysconfig_1.21.1" -type f -name sysconfig_cli.sh -print -quit)
          XDC=$(find "$HOME/ti/ccs1280" -type d -name xdctools_3_62_01_16_core -print -quit)
          CCS_ECLIPSE=$(find "$HOME/ti/ccs1280" -type f -name eclipse -path '*/eclipse/eclipse' -perm -u+x -print -quit)
          test -x "$TIARMCLANG" && test -x "$SYSCONFIG" && test -d "$XDC" && test -x "$CCS_ECLIPSE"
          "$TIARMCLANG" --version | tee build-evidence/compiler-version.txt
          grep -F '3.2.2.LTS' build-evidence/compiler-version.txt
          BUNDLED=$(find "$HOME/ti/ccs1280" -maxdepth 5 -type d -name sysconfig_1.21.0 -print -quit)
          test -d "$BUNDLED"
          mv "$BUNDLED" "$BUNDLED.orig-1.21.0"
          ln -s "$HOME/ti/sysconfig_1.21.1" "$BUNDLED"
          test "$(readlink "$BUNDLED")" = "$HOME/ti/sysconfig_1.21.1"
          {
            echo "TIARMCLANG=$TIARMCLANG"
            echo "SYSCONFIG=$SYSCONFIG"
            echo "XDC=$XDC"
            echo "CCS_ECLIPSE=$CCS_ECLIPSE"
          } >> "$GITHUB_ENV"
      - name: Build genuine P7 ARM-M4F SDK libraries
        shell: bash
        run: |
          set -euo pipefail
          export TICLANG_ARMCOMPILER="$(dirname "$(dirname "$TIARMCLANG")")"
          export XDC_INSTALL_DIR="$XDC"
          export SYSCONFIG_TOOL="$SYSCONFIG"
          export GCC_ARMCOMPILER=
          export IAR_ARMCOMPILER=
          cmake -G "Unix Makefiles" -S sdk -B sdk/build/ticlang --log-level=VERBOSE
          cmake --build sdk/build/ticlang \
            --target tirtos7_m4f drivers_cc13x2x7 display_cc13x2x7 \
                     driverlib_cc13x2x7_cc26x2x7 spiffs_m4f_cc26xx \
            -j 2 2>&1 | tee build-evidence/p7-sdk-libs-build.log
          python3 - <<'PY'
          from pathlib import Path
          import shutil,sys
          sdk=Path("sdk")
          built=[p for p in (sdk/"build/ticlang").rglob("*")
                 if p.is_file() and p.suffix in (".a",".lib")]
          wanted={
            "sysbios.a":"kernel/tirtos7/packages/ti/sysbios/lib/ticlang/m4f/sysbios.a",
            "drivers_cc13x2x7.a":"source/ti/drivers/lib/ticlang/m4f/drivers_cc13x2x7.a",
            "display_cc13x2x7.a":"source/ti/display/lib/ticlang/m4f/display_cc13x2x7.a",
            "driverlib.lib":"source/ti/devices/cc13x2x7_cc26x2x7/driverlib/bin/ticlang/driverlib.lib",
            "spiffs_cc26xx.a":"source/third_party/spiffs/lib/ticlang/m4f/spiffs_cc26xx.a"
          }
          for name,rel in wanted.items():
            matches=[p for p in built if p.name==name]
            if len(matches)!=1:
              sys.exit("G2_LIBRARY_NOT_UNIQUE "+name+": "+repr(matches))
            src=matches[0]
            if src.stat().st_size<100: sys.exit("G2_LIBRARY_EMPTY "+name)
            dst=sdk/rel
            dst.parent.mkdir(parents=True,exist_ok=True)
            shutil.copy2(src,dst)
            print("G2_NATIVE_LIBRARY",name,src.stat().st_size,rel)
          PY
      - name: Register SDK and import pristine P7 TI LaunchPad project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ccs-workspace
          xvfb-run -a "$CCS_ECLIPSE" -noSplash \
            -data "$GITHUB_WORKSPACE/ccs-workspace" \
            -application com.ti.common.core.initialize \
            -ccs.productDiscoveryPath "$GITHUB_WORKSPACE/sdk;$HOME/ti/sysconfig_1.21.1" \
            2>&1 | tee build-evidence/ccs-register.log
          PROJECTSPEC="$GITHUB_WORKSPACE/examples/examples/rtos/LP_CC1352P7_4/zstack/znp/tirtos7/ticlang/znp_LP_CC1352P7_4_tirtos7_ticlang.projectspec"
          test -s "$PROJECTSPEC"
          xvfb-run -a "$CCS_ECLIPSE" -noSplash \
            -data "$GITHUB_WORKSPACE/ccs-workspace" \
            -application com.ti.ccstudio.apps.projectCreate \
            -ccs.projectSpec "$PROJECTSPEC" -ccs.overwrite \
            2>&1 | tee build-evidence/ccs-project-import.log
          OPTS=$(find ccs-workspace -type f -path '*/Stack/Config/znp_cnf.opts' -print)
          test "$(printf '%s\n' "$OPTS" | sed '/^$/d' | wc -l)" -eq 1
          test "$(sha256sum "$OPTS" | cut -d ' ' -f1)" = \
               "$(sha256sum sdk/source/ti/zstack/apps/znp/znp_cnf.opts | cut -d ' ' -f1)"
          echo "IMPORTED_OPTS=$OPTS" >> "$GITHUB_ENV"
      - name: Real TI CCS ARM-M4F ZNP compiler and linker
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a "$CCS_ECLIPSE" -noSplash \
            -data "$GITHUB_WORKSPACE/ccs-workspace" \
            -application com.ti.ccstudio.apps.projectBuild \
            -ccs.projects znp_LP_CC1352P7_4_tirtos7_ticlang \
            -ccs.configuration default \
            2>&1 | tee build-evidence/ccs-build.log
          OUT=$(find ccs-workspace -type f -name '*.out' -print -quit)
          MAP=$(find ccs-workspace -type f -name '*.map' -print -quit)
          GENH=$(find ccs-workspace -type f -name ti_zstack_config.h -print -quit)
          test -n "$OUT" && test -n "$MAP" && test -n "$GENH"
          test -s "$OUT" && test -s "$MAP" && test -s "$GENH"
          {
            echo "P7_OUT=$OUT"
            echo "P7_MAP=$MAP"
            echo "P7_GENH=$GENH"
          } >> "$GITHUB_ENV"
      - name: Audit actual ELF, Intel HEX, memory and protected last flash sector
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle
          cp "$P7_OUT" bundle/TI-LP-CC1352P7_4-REFERENCE-NOT-FLASHABLE.out
          cp "$P7_MAP" bundle/TI-LP-CC1352P7_4-REFERENCE-NOT-FLASHABLE.map
          cp "$P7_GENH" bundle/ti_zstack_config.h
          # Preserve the actual generated TI SysConfig CCFG, UART and RF
          # sources so reviewers can inspect *effective* LaunchPad pin
          # assignment without mistaking it for verified SMLIGHT wiring.
          for fname in ti_devices_config.c ti_radio_config.c ti_drivers_config.c \
                       ti_sysbios_config.c ti_drivers_config.h ti_radio_config.h; do
            SRC=$(find ccs-workspace -type f -path "*/default/syscfg/$fname" -print -quit)
            if test -n "$SRC"; then cp "$SRC" "bundle/$fname"; fi
          done
          test -s bundle/ti_devices_config.c
          test -s bundle/ti_radio_config.c
          echo 'G2 generated CCFG/RF sources available for independent review'
          grep -E '^[[:space:]]*(FLASH|FLASH_NV|FLASH_LAST|SRAM|GPRAM)[[:space:]]' "$P7_MAP" || true
          cp "$IMPORTED_OPTS" bundle/pristine-znp_cnf.opts
          cp build-evidence/pristine-ti-source.json bundle/
          cp build-evidence/compiler-version.txt bundle/
          cp build-evidence/ccs-build.log bundle/
          cp build-evidence/vendor-installer-sha256.txt bundle/
          TIARMOBJCOPY="$(dirname "$TIARMCLANG")/tiarmobjcopy"
          test -x "$TIARMOBJCOPY"
          "$TIARMOBJCOPY" "$P7_OUT" --output-target ihex \
            bundle/TI-LP-CC1352P7_4-REFERENCE-NOT-FLASHABLE.hex
          python3 repo/firmware/slzb-06p7/ti832/g2/verify_vanilla.py linked \
            --sdk sdk --examples examples --out "$P7_OUT" --map "$P7_MAP" \
            --hex bundle/TI-LP-CC1352P7_4-REFERENCE-NOT-FLASHABLE.hex \
            --header "$P7_GENH" --opts "$IMPORTED_OPTS" \
            --source-evidence build-evidence/pristine-ti-source.json \
            --evidence bundle/G2-LINKED-EVIDENCE.json
          # Correlate actual ARM ELF PT_LOAD bytes with independently parsed
          # checksummed Intel HEX. Neither a fake ELF header nor a modified
          # valid-checksum HEX may pass this gate.
          python3 repo/firmware/slzb-06p7/ti832/g2/validate_elf_hex.py \
            --elf "$P7_OUT" \
            --hex bundle/TI-LP-CC1352P7_4-REFERENCE-NOT-FLASHABLE.hex \
            --out bundle/ELF-HEX-BINDING.json
          python3 repo/firmware/slzb-06p7/ti832/g3/analyze_memory.py \
            --map "$P7_MAP" --out bundle/G3-STATIC-MEMORY-EVIDENCE.json
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path("bundle")
          x=json.loads((root/"G2-LINKED-EVIDENCE.json").read_text())
          assert x["status"]=="REAL_CCS_LINKED_REFERENCE_ONLY"
          assert x["flash_authorized"] is False and x["nv_image_payload_bytes"]==0
          binding=json.loads((root/"ELF-HEX-BINDING.json").read_text())
          assert binding["status"]=="ELF_HEX_EXACT_PROGRAM_BYTES_MATCH"
          assert binding["exact_programmed_addresses_and_values"]==176484
          assert binding["flash_authorized"] is False
          files={p.name:{"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
                         "size_bytes":p.stat().st_size} for p in root.iterdir() if p.is_file()}
          manifest={"source_sha":os.environ["GITHUB_SHA"],
            "sdk_sha":"6499c3f53fc5fb5806213be695450a7b43fbaf3d",
            "examples_sha":"87ff5b638b632050228a7504f35cf3b95581c278",
            "qualification":"REFERENCE_ONLY_NOT_FLASHABLE",
            "flash_authorized":False,"hardware_qualified":False,
            "actual_slzb_ccfg_verified":False,"original_pinmap_verified":False,
            "artifacts":files}
          (root/"MANIFEST.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
            f.write("## Actual P7 CCS linked reference: NOT FLASHABLE\n\n")
            f.write(f"- Flash used: {x['linker']['flash_used']} bytes\n")
            f.write(f"- SRAM used: {x['linker']['sram_used']} bytes\n")
            f.write(f"- CCFG-linked bytes: {x['linker']['ccfg_sector_used']}\n")
            f.write("- SLZB-06P7 board pinout and CCFG: unverified.\n")
          PY
          printf '%s\n' \
            'REAL_CCS_LINKED_REFERENCE_ONLY' 'DO_NOT_FLASH_TO_SMLIGHT' \
            'NO_PRODUCTION_DEVICE_OR_NETWORK_ACCESSED' > bundle/NOT_FLASHABLE.txt
      - name: Reject incomplete/unsafe G2 binary packaging
        shell: bash
        run: |
          set -euo pipefail
          test -s bundle/NOT_FLASHABLE.txt
          test -s bundle/G2-LINKED-EVIDENCE.json
          test -s bundle/ELF-HEX-BINDING.json
          test -s bundle/MANIFEST.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("bundle")
          m=json.loads((p/"MANIFEST.json").read_text())
          assert m["flash_authorized"] is False
          assert m["hardware_qualified"] is False
          assert m["qualification"]=="REFERENCE_ONLY_NOT_FLASHABLE"
          assert len(m["artifacts"])>=16
          assert "ELF-HEX-BINDING.json" in m["artifacts"]
          assert "G3-STATIC-MEMORY-EVIDENCE.json" in m["artifacts"]
          assert "G2-LINKED-EVIDENCE.json" in m["artifacts"]
          x=json.loads((p/"ELF-HEX-BINDING.json").read_text())
          assert x["status"]=="ELF_HEX_EXACT_PROGRAM_BYTES_MATCH"
          assert x["flash_authorized"] is False
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p7-g2-TI-LP-CC1352P7_4-REFERENCE-ONLY-NOT-FLASHABLE
          path: bundle/
          retention-days: 30
          if-no-files-found: error
      # The immutable vanilla G2 reference is uploaded ABOVE this optional
      # diagnostic candidate. These sources and artifacts are kept separate.
      - name: Apply isolated UART pointer-type candidate overlay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p g3-candidate
          SRC=sdk/source/ti/zstack/npi/npi_tl.c
          cp "$SRC" g3-candidate/original-npi_tl.c
          test "$(git -C sdk rev-parse HEAD)" = "6499c3f53fc5fb5806213be695450a7b43fbaf3d"
          python3 repo/firmware/slzb-06p7/ti832/g3/fix_uart_pointer_types.py \
            --input g3-candidate/original-npi_tl.c --output "$SRC" \
            | tee g3-candidate/source-digests.log
          python3 - <<'PY'
          from pathlib import Path
          a=Path("g3-candidate/original-npi_tl.c").read_text()
          b=Path("sdk/source/ti/zstack/npi/npi_tl.c").read_text()
          for name in ("npiRxBuf","npiTxBuf"):
              src=f"static Char {name}[NPI_TL_BUF_SIZE];"
              dst=f"static uint8_t {name}[NPI_TL_BUF_SIZE];"
              assert a.count(src)==1 and b.count(dst)==1
              a=a.replace(src,dst)
          assert a==b, "UNEXPECTED_SDK_SOURCE_PATCH"
          PY
          test "$(git -C sdk diff --name-only HEAD | wc -l)" -eq 1
          test "$(git -C sdk diff --name-only HEAD)" = "source/ti/zstack/npi/npi_tl.c"
      - name: Rebuild isolated UART candidate with genuine CCS
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a "$CCS_ECLIPSE" -noSplash \
            -data "$GITHUB_WORKSPACE/ccs-workspace" \
            -application com.ti.ccstudio.apps.projectBuild \
            -ccs.projects znp_LP_CC1352P7_4_tirtos7_ticlang \
            -ccs.configuration default \
            2>&1 | tee g3-candidate/ccs-candidate-build.log
          if grep -E 'npi_tl.c:.*warning:.*pointer-sign' g3-candidate/ccs-candidate-build.log; then
             echo "::error::NPI transport pointer warning remains"
             exit 1
          fi
          if grep -E 'error:|^ERROR:' g3-candidate/ccs-candidate-build.log; then
             echo "::error::G3 UART candidate compile error"
             exit 1
          fi
          test -s "$P7_OUT" && test -s "$P7_MAP"
          OBJCOPY="$(dirname "$TIARMCLANG")/tiarmobjcopy"
          "$OBJCOPY" "$P7_OUT" --output-target ihex \
            g3-candidate/UART-TYPE-CANDIDATE-NOT-FLASHABLE.hex
          python3 repo/firmware/slzb-06p7/ti832/g2/validate_elf_hex.py \
            --elf "$P7_OUT" \
            --hex g3-candidate/UART-TYPE-CANDIDATE-NOT-FLASHABLE.hex \
            --out g3-candidate/ELF-HEX-CANDIDATE-BINDING.json
          # Source type fix must not change any programmed code or configuration.
          ACTUAL=$(sha256sum g3-candidate/UART-TYPE-CANDIDATE-NOT-FLASHABLE.hex | cut -d' ' -f1)
          test "$ACTUAL" = "5b19e5a3cac13349b30188bc1e5dcf78f544019516b43181f4cf126aeb47de13"
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("g3-candidate")
          bind=json.loads((root/"ELF-HEX-CANDIDATE-BINDING.json").read_text())
          assert bind["exact_programmed_addresses_and_values"]==176484
          assert bind["flash_authorized"] is False
          outfile=Path("ccs-workspace/znp_LP_CC1352P7_4_tirtos7_ticlang/default/znp_LP_CC1352P7_4_tirtos7_ticlang.out")
          result={"status":"NPI_UART_TYPE_CANDIDATE_REBUILT",
            "target":"TI_CC1352P7_LAUNCHPAD_NOT_SMLIGHT",
            "only_modified_source":"source/ti/zstack/npi/npi_tl.c",
            "two_unsigned_byte_buffer_types":True,
            "pointer_sign_warnings_removed":True,
            "hex_identical_to_vanilla":True,
            "runtime_qualified":False,"hardware_qualified":False,"flash_authorized":False,
            "candidate_elf_sha256":hashlib.sha256(outfile.read_bytes()).hexdigest(),
            "candidate_hex_sha256":hashlib.sha256((root/"UART-TYPE-CANDIDATE-NOT-FLASHABLE.hex").read_bytes()).hexdigest()}
          (root/"CANDIDATE-AUDIT.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          PY
          printf '%s\n' 'G3_CANDIDATE_NOT_FLASHABLE' 'UNVERIFIED_SMLIGHT_BOARD' \
            'STOCK_G2_REFERENCE_PRESERVED' > g3-candidate/NOT_FLASHABLE.txt
      - name: Upload candidate only after successful independent native build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p7-g3-UART-TYPE-CANDIDATE-NOT-FLASHABLE
          path: g3-candidate/
          retention-days: 30
          if-no-files-found: error
      # The following is a separate, non-flashable *G3 capacity prototype*:
      # it changes the NV base to 0xA4000. It must NEVER be used with an
      # existing coordinator network or original 2-page NV without proven
      # migration and intact security counters.
      - name: Prepare isolated P7 five-page NV layout candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p g3-nv5
          # Restore UART source after the already-sealed warning-fix artifact.
          # Thus NV5 changes *only* the 3 expected geometry inputs.
          cp g3-candidate/original-npi_tl.c sdk/source/ti/zstack/npi/npi_tl.c
          git -C sdk diff --exit-code HEAD -- source/ti/zstack/npi/npi_tl.c
          python3 repo/firmware/slzb-06p7/ti832/g3/nv5_layout.py \
            --sdk sdk --examples examples --out g3-nv5/staged \
            > g3-nv5/source-audit.log
          python3 - <<'PY'
          import json,shutil
          from pathlib import Path
          g=Path("g3-nv5/staged")
          manifest=json.loads((g/"NV5-CANDIDATE-SOURCE-MANIFEST.json").read_text())
          assert manifest["qualification"]=="G3_NV5_TI_LAUNCHPAD_PROTOTYPE_NOT_FLASHABLE"
          assert manifest["nv_pages"]==5
          allowed={
            "sdk/source/ti/zstack/boards/cc13x2x7_cc26x2x7/cc13x2x7_cc26x2x7_tirtos7_ticlang.cmd",
            "examples/examples/rtos/LP_CC1352P7_4/zstack/znp/tirtos7/znp.syscfg",
            "examples/examples/rtos/LP_CC1352P7_4/zstack/znp/tirtos7/ticlang/znp_LP_CC1352P7_4_tirtos7_ticlang.projectspec",
          }
          actual={p.as_posix() for p in g.rglob("*") if p.is_file() and p.name!="NV5-CANDIDATE-SOURCE-MANIFEST.json"}
          assert actual=={str(Path("g3-nv5/staged")/a) for a in allowed},(actual,allowed)
          for entry in sorted(actual):
              src=Path(entry)
              relative=src.relative_to(g)
              dest=Path(str(relative))
              assert dest.exists(),dest
              shutil.copy2(src,dest)
          PY
          test "$(git -C sdk diff --name-only HEAD)" = \
             "source/ti/zstack/boards/cc13x2x7_cc26x2x7/cc13x2x7_cc26x2x7_tirtos7_ticlang.cmd"
          git -C examples diff --name-only HEAD | sort > g3-nv5/source-diff-names.txt
          diff -u <(printf '%s\n' \
            'examples/rtos/LP_CC1352P7_4/zstack/znp/tirtos7/ticlang/znp_LP_CC1352P7_4_tirtos7_ticlang.projectspec' \
            'examples/rtos/LP_CC1352P7_4/zstack/znp/tirtos7/znp.syscfg' | sort) \
            g3-nv5/source-diff-names.txt
          cp g3-nv5/staged/NV5-CANDIDATE-SOURCE-MANIFEST.json g3-nv5/
          printf '%s\n' 'NV_BASE_MOVED_FROM_0xAA000_TO_0xA4000' \
              'DO_NOT_FLASH_OR_MIGRATE_EXISTING_NETWORK' \
              'CCFG_AND_SECURITY_RESTORE_NOT_VERIFIED' > g3-nv5/NOT_FLASHABLE.txt

      - name: Native CCS import and build P7 NVOCMP five-sector prototype
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ccs-workspace-nv5
          xvfb-run -a "$CCS_ECLIPSE" -noSplash \
            -data "$GITHUB_WORKSPACE/ccs-workspace-nv5" \
            -application com.ti.common.core.initialize \
            -ccs.productDiscoveryPath "$GITHUB_WORKSPACE/sdk;$HOME/ti/sysconfig_1.21.1" \
            2>&1 | tee g3-nv5/ccs-init.log
          SPEC="$GITHUB_WORKSPACE/examples/examples/rtos/LP_CC1352P7_4/zstack/znp/tirtos7/ticlang/znp_LP_CC1352P7_4_tirtos7_ticlang.projectspec"
          grep -F -- '-DNVOCMP_NVPAGES=5' "$SPEC"
          grep -F -- '--define=NVOCMP_NVPAGES=5' "$SPEC"
          xvfb-run -a "$CCS_ECLIPSE" -noSplash \
            -data "$GITHUB_WORKSPACE/ccs-workspace-nv5" \
            -application com.ti.ccstudio.apps.projectCreate \
            -ccs.projectSpec "$SPEC" -ccs.overwrite \
            2>&1 | tee g3-nv5/ccs-import.log
          xvfb-run -a "$CCS_ECLIPSE" -noSplash \
            -data "$GITHUB_WORKSPACE/ccs-workspace-nv5" \
            -application com.ti.ccstudio.apps.projectBuild \
            -ccs.projects znp_LP_CC1352P7_4_tirtos7_ticlang \
            -ccs.configuration default \
            2>&1 | tee g3-nv5/ccs-native-build.log
          OUT=$(find ccs-workspace-nv5 -type f -name '*.out' -print -quit)
          MAP=$(find ccs-workspace-nv5 -type f -name '*.map' -print -quit)
          HEADER=$(find ccs-workspace-nv5 -type f -name ti_drivers_config.c -print -quit)
          test -s "$OUT" && test -s "$MAP" && test -s "$HEADER"
          cp "$OUT" g3-nv5/P7-NV5-PROTOTYPE-NOT-FLASHABLE.out
          cp "$MAP" g3-nv5/P7-NV5-PROTOTYPE-NOT-FLASHABLE.map
          cp "$HEADER" g3-nv5/generated-ti_drivers_config.c
          "$(dirname "$TIARMCLANG")/tiarmobjcopy" "$OUT" \
            --output-target ihex g3-nv5/P7-NV5-PROTOTYPE-NOT-FLASHABLE.hex

      - name: Audit five-sector NV prototype ELF, HEX, linker and source parity
        shell: bash
        run: |
          set -euo pipefail
          python3 repo/firmware/slzb-06p7/ti832/g3/nv5_verify_linked.py \
            --elf g3-nv5/P7-NV5-PROTOTYPE-NOT-FLASHABLE.out \
            --hex g3-nv5/P7-NV5-PROTOTYPE-NOT-FLASHABLE.hex \
            --map g3-nv5/P7-NV5-PROTOTYPE-NOT-FLASHABLE.map \
            --out g3-nv5/NV5-NATIVE-ELF-HEX-MAP-AUDIT.json
          python3 repo/firmware/slzb-06p7/ti832/g3/nv5_effective.py \
            --generated g3-nv5/generated-ti_drivers_config.c \
            --compiler-log g3-nv5/ccs-native-build.log \
            --linked-proof g3-nv5/NV5-NATIVE-ELF-HEX-MAP-AUDIT.json \
            --out g3-nv5/NV5-EFFECTIVE-DRIVER-AUDIT.json
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "repo/firmware/slzb-06p7/ti832/g2")
          from validate_elf_hex import read_hex
          g2 = read_hex(Path("bundle/TI-LP-CC1352P7_4-REFERENCE-NOT-FLASHABLE.hex").read_text(encoding="ascii"))
          nv5 = read_hex(Path("g3-nv5/P7-NV5-PROTOTYPE-NOT-FLASHABLE.hex").read_text(encoding="ascii"))
          lo, hi = 0xAFFA8, 0xB0000
          a = {k: v for k, v in g2.items() if lo <= k < hi}
          b = {k: v for k, v in nv5.items() if lo <= k < hi}
          assert len(a) == 88 and a == b, "NV5_CCFG_BYTES_DIFFER_FROM_G2"
          print("PASS NV5 CCFG 88 bytes identical to G2 vanilla")
          PY
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("g3-nv5")
          d=json.loads((root/"NV5-NATIVE-ELF-HEX-MAP-AUDIT.json").read_text())
          m=json.loads((root/"NV5-CANDIDATE-SOURCE-MANIFEST.json").read_text())
          assert d["status"]=="NV5_NATIVE_ELF_HEX_LINKER_GEOMETRY_PASS"
          effective=json.loads((root/"NV5-EFFECTIVE-DRIVER-AUDIT.json").read_text())
          assert effective["status"]=="G3_NV5_EFFECTIVE_NVOCMP_AND_NVS_DRIVER_PASS"
          assert effective["compiled_driver"]["nvocmp_c_compiled_with_pages"]==5
          assert effective["generated_internal_nvs"]["internal_driver_region_size_bytes"]==40960
          assert d["nv_reserved_bytes"]==40960 and d["nv_image_loaded_bytes"]==0
          assert d["nv_region_start"]=="0xa4000"
          assert d["flash_authorized"] is False
          assert m["old_network_nv_not_directly_interchangeable"] is True
          artifacts={p.name:{"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
                             "size_bytes":p.stat().st_size}
                     for p in root.iterdir() if p.is_file()}
          (root/"SEALED-NV5-MANIFEST.json").write_text(
            json.dumps({"qualification":"G3_NV5_TI_LAUNCHPAD_PROTOTYPE_NOT_FLASHABLE",
                        "runtime_qualified":False,"original_network_migration_verified":False,
                        "flash_authorized":False,"files":artifacts},
                        indent=2,sort_keys=True)+"\n")
          PY
      - name: Publish non-flashable NV5 compiler proof only when audited
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: P7-G3-NV5-CCS-PROTOTYPE-NOT-FLASHABLE
          path: |
            g3-nv5/*.json
            g3-nv5/*.txt
            g3-nv5/*.log
            g3-nv5/*.out
            g3-nv5/*.hex
            g3-nv5/*.map
            g3-nv5/generated-ti_drivers_config.c
          retention-days: 30
          if-no-files-found: error
      - name: Preserve troubleshooting evidence without releasing unqualified binaries
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: p7-g2-FAILED-BUILD-LOGS-ONLY-NO-FIRMWARE
          path: |
            build-evidence/*.log
            build-evidence/compiler-version.txt
          retention-days: 7
          if-no-files-found: warn
