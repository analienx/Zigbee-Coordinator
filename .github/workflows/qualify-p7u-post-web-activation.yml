name: P7U post-web diagnostic activation boundaries (NO LIVE ACTION)
on:
  pull_request:
    paths:
      - 'host/r4-b4/p7u_post_web_activation.py'
      - 'host/r4-b4/test-p7u-post-web-activation.py'
      - '.github/workflows/qualify-p7u-post-web-activation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  activation-boundaries:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    env:
      SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify fixed operation boundaries without hardware
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE"
          python host/r4-b4/test-p7u-post-web-activation.py -v
          python host/r4-b4/test-p7u-web-flash-trial.py -v
          python -m py_compile host/r4-b4/p7u_post_web_activation.py
      - name: Seal exact activation helper
        run: |
          mkdir /tmp/activation-release
          cp host/r4-b4/{p7u_post_web_activation.py,p7u_web_flash_trial.py,p7u_host_integrity.py,p7u_f2_acceptance.py} /tmp/activation-release/
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          d=Path('/tmp/activation-release')
          r={'schema':'p7u-post-web-activation-release-v1','source_sha':os.environ['SOURCE'],
             'files':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in d.iterdir()},
             'live_action_performed':False,'host_source_sha':'9d13e8ce641968126c0e67fd57ca8de6a69478c4'}
          (d/'ACTIVATION_RELEASE.json').write_text(json.dumps(r,sort_keys=True,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p7u-post-web-activation-release-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/activation-release/
          if-no-files-found: error
