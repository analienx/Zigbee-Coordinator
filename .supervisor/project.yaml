schema_version: 1
project_id: zigbee-coordinator
repo: analienx/Zigbee-Coordinator
repository_visibility: public
lifecycle: active

execution:
  schema_version: 1
  default_mode: github_actions
  optional_modes: []
  build_lane: GitHub-hosted Actions only; exact candidate SHA
  host_specialist: explicit-user-authorized USB/Zigbee coordinator hardware operations only; never use local execution as build/test/verification evidence

executor:
  environment: github_hosted_actions
  runtime: github_actions
  interface: github_actions
  management_paths:
    - github_actions
    - usb
    - ssh_ha

control:
  incident_repo: analienx/home-assistant-stack
  incident_issue: 73

protected_invariants:
  - preserve coordinator IEEE/PAN/extPAN/network key and security state
  - fresh verified coordinator backup before any flash when radio is readable
  - no erase/reflash/restore during failure-state discrimination unless separately authorized
  - hardware recovery experiments must be bounded and evidence-preserving
