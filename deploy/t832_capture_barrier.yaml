# T832-DIAG-R0 capture barrier (UNDEPLOYED CANDIDATE).
#
# Purpose: wrap the production Zigbee2MQTT RTS recovery path
# (automation zigbee2mqtt_mesh_communication_outage_alert in the
# home-assistant-stack repository) with a file-only evidence barrier:
# capture -> authorize -> stop-confirm -> EXISTING validated R2 helper
# (shell_command.mr4u_p10_rts_reset) -> verified start -> ZDO check ->
# stabilizing -> continuous 10-minute stability close.
#
# Design rules enforced by firmware/t832/test_barrier.py:
# - every destructive step is gated by a response_variable plus a template
#   condition on that exact response; no continue_on_error on them;
# - the only RTS implementation referenced is the existing validated helper;
# - no notification actions (logbook/system_log only);
# - mode single; the incident latch is the cross-run guard.
#
# Deploy-time bindings (operator sets these, documented in the runbook):
# - T832 incident tool path (t832_incident.py) and state root;
# - supervisor add-on slug is fixed below (45df7312_zigbee2mqtt).
# Shell command bodies live in deploy/t832_shell_commands.yaml.

- id: zigbee2mqtt_t832_capture_barrier
  alias: Zigbee2MQTT - T832 capture barrier before RTS recovery
  description: >-
    Capture a 15-minute evidence incident and require a one-shot reset permit
    before the existing RTS recovery path runs. Reuses the production outage
    triggers; every fallible service carries continue_on_error with
    fail-closed response gates, so service exceptions, malformed or absent
    responses still reach a terminal persisted recovery-result (R4-F05). The
    ZDO response is caught by a pre-armed incident-scoped catcher (R4-F02).
  triggers:
    # A file-backed startup observer emits this after a fresh existing-owner
    # request. capture() independently checks persisted evidence; event data
    # alone cannot authorize recovery. No MQTT transition is required.
    - trigger: event
      event_type: t832_startup_health
      id: startup_health
    - trigger: state
      entity_id: binary_sensor.zigbee2mqtt_mesh_communication_outage
      to: "on"
      for: "00:05:00"
      id: mesh_outage
    - trigger: state
      entity_id: binary_sensor.zigbee2mqtt_bridge_online
      to: "off"
      for: "00:05:00"
      id: bridge_offline
    - trigger: mqtt
      topic: zigbee2mqtt/bridge/response/permit_join
      value_template: >-
        {% set error = value_json.error | default('') %}
        {{ 'radio_timeout' if value_json.status | default('') == 'error'
           and 'SRSP -' in error and 'after 6000ms' in error else 'ignore' }}
      payload: radio_timeout
      id: radio_timeout
  conditions: []
  actions:
    # State triggers carry no payload to evaluate (HA enforced their
    # to-state plus the for-duration before firing); the mqtt trigger's
    # topic and response payload ride along for tool-side qualification.
    # Only a production timeout-family error on the permit_join response
    # topic qualifies (status error with SRSP - and after 6000ms).
    - service: shell_command.t832_capture
      data:
        trigger: "{{ trigger.id }}"
        trigger_topic: "{{ trigger.topic | default('') }}"
        trigger_payload_json: >-
          {{ (trigger.event.data if trigger.id == 'startup_health'
              else trigger.payload_json | default({})) | tojson }}
      response_variable: t832_capture
      # R4-F05: a service exception leaves the response unset; the
      # returncode-first gates below route that to a halt, never onward.
      continue_on_error: true
    - condition: template
      value_template: >-
        {{ t832_capture['returncode'] == 0
           and (t832_capture['stdout'] | from_json).ok }}
    - service: shell_command.t832_authorize_reset
      response_variable: t832_authorize
      continue_on_error: true
    - condition: template
      value_template: >-
        {{ t832_authorize['returncode'] == 0
           and (t832_authorize['stdout'] | from_json).status == 'reset_authorized'
           and (t832_authorize['stdout'] | from_json).incident_id
               == (t832_capture['stdout'] | from_json).incident_id }}
    - service: shell_command.t832_mark_recovering
      response_variable: t832_marking
      continue_on_error: true
    - condition: template
      value_template: >-
        {{ t832_marking['returncode'] == 0
           and (t832_marking['stdout'] | from_json).status == 'recovering' }}
    - service: logbook.log
      data:
        name: Zigbee2MQTT T832 barrier
        message: >-
          Incident {{ (t832_capture['stdout'] | from_json).incident_id }}
          captured and reset-authorized; stopping Zigbee2MQTT.
        entity_id: binary_sensor.zigbee2mqtt_bridge_online
    # R4-F05: API timeout/401 or a transport exception must not strand
    # the incident: the bounded poll below confirms the real state and the
    # stop-confirmed gate routes any unconfirmed outcome to the terminal
    # failed branch with reason and phase.
    - service: hassio.addon_stop
      data:
        addon: 45df7312_zigbee2mqtt
      continue_on_error: true
    - repeat:
        until: >-
          {{ (t832_addon_state is defined and t832_addon_state['returncode'] == 0
              and (t832_addon_state['stdout'] | from_json).state == 'stopped')
             or repeat.index >= 6 }}
        sequence:
          - service: shell_command.t832_addon_state
            response_variable: t832_addon_state
            continue_on_error: true
          - delay:
              seconds: 10
    # B08: a halted stop check reports the terminal failure (reason and
    # phase) instead of stranding the latch in recovering with no reset
    # consumed. The failing condition below stops the run after reporting.
    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {{ t832_addon_state is defined and t832_addon_state['returncode'] == 0
                   and (t832_addon_state['stdout'] | from_json).state == 'stopped' }}
          sequence: []
      default:
        - service: shell_command.t832_recovery_result
          data:
            success: false
            normal_traffic: false
            zdo_ok: false
            zdo_transaction: ""
            failure_reason: "addon-stop-unconfirmed"
            failure_phase: "stop"
          response_variable: t832_stop_failed
          continue_on_error: true
        - condition: template
          value_template: "{{ false }}"
    # The ONLY reset implementation: the existing validated R2 helper.
    # Zigbee2MQTT is confirmed stopped above before this runs (serial
    # ownership prerequisite: the RTS line is only toggled with the
    # coordinator serial free). The latch permits exactly one RTS per
    # incident; t832_rts_used records it, and any retry halts here.
    - service: shell_command.mr4u_p10_rts_reset
      response_variable: t832_rts
      continue_on_error: true
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ t832_rts['returncode'] == 0 }}"
          sequence: []
      default:
        - service: shell_command.t832_recovery_result
          data:
            success: false
            normal_traffic: false
            zdo_ok: false
            zdo_transaction: ""
            failure_reason: "rts-unconfirmed"
            failure_phase: "rts"
          response_variable: t832_rts_failed
        - condition: template
          value_template: "{{ false }}"
    - service: shell_command.t832_rts_used
      response_variable: t832_rts_marked
      continue_on_error: true
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ t832_rts_marked['returncode'] == 0 }}"
          sequence: []
      default:
        - service: shell_command.t832_recovery_result
          data:
            success: false
            normal_traffic: false
            zdo_ok: false
            zdo_transaction: ""
            failure_reason: "rts-unconfirmed"
            failure_phase: "rts"
          response_variable: t832_rts_mark_failed
        - condition: template
          value_template: "{{ false }}"
    - service: hassio.addon_start
      data:
        addon: 45df7312_zigbee2mqtt
      continue_on_error: true
    # B08: confirm the start like the stop (bounded poll, reported halt),
    # then wait on the bridge state itself: wait_template re-evaluates the
    # CURRENT state, so an already-online bridge completes immediately
    # instead of missing a transition that already happened.
    # R4-F05: as with the stop poll, an absent or malformed poll response
    # routes to the terminal failed branch, never past it.
    - repeat:
        until: >-
          {{ (t832_addon_start_state is defined and t832_addon_start_state['returncode'] == 0
              and (t832_addon_start_state['stdout'] | from_json).state == 'started')
             or repeat.index >= 6 }}
        sequence:
          - service: shell_command.t832_addon_state
            response_variable: t832_addon_start_state
            continue_on_error: true
          - delay:
              seconds: 5
    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {{ t832_addon_start_state is defined and t832_addon_start_state['returncode'] == 0
                   and (t832_addon_start_state['stdout'] | from_json).state == 'started' }}
          sequence: []
      default:
        - service: shell_command.t832_recovery_result
          data:
            success: false
            normal_traffic: false
            zdo_ok: false
            zdo_transaction: ""
            failure_reason: "addon-start-unconfirmed"
            failure_phase: "start"
          response_variable: t832_start_failed
          continue_on_error: true
        - condition: template
          value_template: "{{ false }}"
    - wait_template: "{{ is_state('binary_sensor.zigbee2mqtt_bridge_online', 'on') }}"
      timeout:
        minutes: 2
      continue_on_timeout: true
    - choose:
        - conditions: "{{ wait.completed }}"
          sequence: []
      default:
        - service: shell_command.t832_recovery_result
          data:
            success: false
            normal_traffic: false
            zdo_ok: false
            zdo_transaction: ""
            failure_reason: "bridge-offline"
            failure_phase: "bridge"
          response_variable: t832_bridge_failed
          continue_on_error: true
        - condition: template
          value_template: "{{ false }}"
    # Bounded ZDO verification, production shape: a single permit_join
    # request with time 0 and a transaction unique to this incident.
    # R4-F02: the incident-scoped catcher automation below is subscribed
    # from HA start — strictly before this publish — so a matching
    # response is captured (proof recorded in the latch) even if it
    # arrives while the publish yields or before the wait below arms.
    # The expectation is armed here, first, then published once, then
    # waited on. Unrelated, stale, retained, duplicate, or malformed
    # replies never match the armed transaction and cannot create proof.
    - service: input_text.set_value
      data:
        entity_id: input_text.t832_zdo_expect
        value: "ha-t832-{{ (t832_capture['stdout'] | from_json).incident_id }}"
    - service: mqtt.publish
      data:
        topic: zigbee2mqtt/bridge/request/permit_join
        payload: '{"time": 0, "transaction": "ha-t832-{{ (t832_capture["stdout"] | from_json).incident_id }}"}'
      continue_on_error: true
    - wait_for_trigger:
        - trigger: mqtt
          topic: zigbee2mqtt/bridge/response/permit_join
          value_template: >-
            {{ (value_json.status | default('')) ~ ':' ~ (value_json.transaction | default('')) }}
          payload: "ok:ha-t832-{{ (t832_capture['stdout'] | from_json).incident_id }}"
      timeout:
        seconds: 15
      continue_on_timeout: true
    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {{ wait.trigger.payload_json.status == 'ok' and
                   wait.trigger.payload_json.transaction ==
                   'ha-t832-' ~ ((t832_capture['stdout'] | from_json).incident_id) }}
          sequence:
            # Real ZDO evidence is recorded here, bound to the observed
            # transaction: an outage-derived Boolean alone is never proof.
            # recovery_result below only accepts zdo_ok against this fresh
            # recorded proof. (The pre-armed catcher records the same proof
            # when the response beat this wait; recording twice is
            # idempotent — freshness and transaction binding still hold.)
            - service: shell_command.t832_zdo_proof
              data:
                transaction: "{{ wait.trigger.payload_json.transaction }}"
              response_variable: t832_zdo
              continue_on_error: true
      default:
        # R4-F02: the wait may have missed a response that arrived before
        # it armed; the pre-armed catcher recorded such proof in the latch.
        # Probe proof read-only: only real recorded proof takes the late
        # success path, otherwise the legacy terminal zdo-unconfirmed
        # failure below. The probe shares the verdict's proof check, so
        # both agree by construction.
        - service: shell_command.t832_zdo_proof_state
          data:
            transaction: "ha-t832-{{ (t832_capture['stdout'] | from_json).incident_id }}"
          response_variable: t832_zdo_late
          continue_on_error: true
        - choose:
            - conditions:
                - condition: template
                  value_template: >-
                    {{ t832_zdo_late is defined and t832_zdo_late['returncode'] == 0
                       and (t832_zdo_late['stdout'] | from_json).proof_ok == true }}
              sequence:
                - service: shell_command.t832_recovery_result
                  data:
                    success: true
                    normal_traffic: "{{ is_state('binary_sensor.zigbee2mqtt_mesh_communication_outage', 'off') }}"
                    zdo_ok: true
                    zdo_transaction: "ha-t832-{{ (t832_capture['stdout'] | from_json).incident_id }}"
                    failure_phase: "zdo"
                  response_variable: t832_zdo_late_verdict
                  continue_on_error: true
                - choose:
                    - conditions:
                        - condition: template
                          value_template: >-
                            {{ t832_zdo_late_verdict is defined
                               and t832_zdo_late_verdict['returncode'] == 0
                               and (t832_zdo_late_verdict['stdout'] | from_json).status == 'stabilizing' }}
                      sequence:
                        - service: logbook.log
                          data:
                            name: Zigbee2MQTT T832 barrier
                            message: >-
                              Incident {{ (t832_capture['stdout'] | from_json).incident_id }}
                              recovering (late ZDO proof); 10-minute stability observation started.
                            entity_id: binary_sensor.zigbee2mqtt_bridge_online
                  default:
                    # The late verdict already persisted its terminal
                    # failure (its reason names the traffic or proof); only
                    # consume the expectation.
                    - service: input_text.set_value
                      data:
                        entity_id: input_text.t832_zdo_expect
                        value: ""
          default:
            - service: shell_command.t832_recovery_result
              data:
                success: false
                normal_traffic: false
                zdo_ok: false
                zdo_transaction: ""
                failure_reason: "zdo-unconfirmed"
                failure_phase: "zdo"
              response_variable: t832_zdo_failed
              continue_on_error: true
            - service: input_text.set_value
              data:
                entity_id: input_text.t832_zdo_expect
                value: ""
        # The wait timed out: every sub-case above ends the run here. A
        # late stabilizing verdict already logged its tail; failed verdicts
        # are persisted with reason and phase.
        - condition: template
          value_template: "{{ false }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ t832_zdo is defined and t832_zdo['returncode'] == 0 }}"
          sequence: []
      default:
        - service: shell_command.t832_recovery_result
          data:
            success: false
            normal_traffic: false
            zdo_ok: false
            zdo_transaction: ""
            failure_reason: "zdo-unconfirmed"
            failure_phase: "zdo"
          response_variable: t832_proof_failed
          continue_on_error: true
        - service: input_text.set_value
          data:
            entity_id: input_text.t832_zdo_expect
            value: ""
        - condition: template
          value_template: "{{ false }}"
    - service: shell_command.t832_recovery_result
      data:
        success: true
        normal_traffic: "{{ is_state('binary_sensor.zigbee2mqtt_mesh_communication_outage', 'off') }}"
        zdo_ok: true
        zdo_transaction: "{{ wait.trigger.payload_json.transaction }}"
        failure_phase: "recovery"
      response_variable: t832_recovered
      continue_on_error: true
    - service: input_text.set_value
      data:
        entity_id: input_text.t832_zdo_expect
        value: ""
    - condition: template
      value_template: >-
        {{ t832_recovered is defined and t832_recovered['returncode'] == 0
           and (t832_recovered['stdout'] | from_json).status == 'stabilizing' }}
    - service: logbook.log
      data:
        name: Zigbee2MQTT T832 barrier
        message: >-
          Incident {{ (t832_capture['stdout'] | from_json).incident_id }}
          recovering; 10-minute stability observation started.
        entity_id: binary_sensor.zigbee2mqtt_bridge_online
  mode: single

# R4-F02: incident-scoped ZDO response catcher. Subscribed from HA start —
# strictly before any recovery publishes its request — so a matching
# response is captured even when it arrives while the barrier's publish
# yields or before its wait arms. The trigger filter equals the armed
# expectation (one incident transaction); the condition additionally
# requires a non-empty expectation and an ok status, so unrelated, stale,
# retained, duplicate (consumed), or malformed replies can never record
# proof. Proof itself is recorded only by the candidate tool with
# freshness, transaction-binding, and boot guards; the expectation is
# consumed only after proof records, so a duplicate cannot extend proof
# freshness, while a tool error leaves it armed for a duplicate to prove.
# Requires an input_text.t832_zdo_expect helper (initial "").
- id: zigbee2mqtt_t832_zdo_catcher
  alias: Zigbee2MQTT - T832 ZDO response catcher
  description: >-
    Pre-armed incident-scoped receiver for the single post-reset ZDO
    permit_join response. Event-driven only: no polling, no probes.
  triggers:
    - trigger: mqtt
      topic: zigbee2mqtt/bridge/response/permit_join
      value_template: "{{ value_json.transaction | default('') }}"
      payload: "{{ states('input_text.t832_zdo_expect') }}"
  conditions:
    - condition: template
      value_template: >-
        {{ states('input_text.t832_zdo_expect') != ''
           and (trigger.payload_json.status | default('')) == 'ok'
           and (trigger.payload_json.transaction | default('')) ==
               states('input_text.t832_zdo_expect') }}
  actions:
    - service: shell_command.t832_zdo_proof
      data:
        transaction: "{{ trigger.payload_json.transaction }}"
      response_variable: t832_catch_proof
      continue_on_error: true
    # The tolerated proof call is gated: the expectation is consumed only
    # after proof actually recorded. A tool error leaves it armed so a
    # duplicate reply can still prove; every barrier terminal branch
    # clears it, so nothing stays armed past the run.
    - choose:
        - conditions:
            - condition: template
              value_template: >-
                {{ t832_catch_proof is defined and t832_catch_proof['returncode'] == 0 }}
          sequence:
            - service: input_text.set_value
              data:
                entity_id: input_text.t832_zdo_expect
                value: ""
      default: []
  mode: single

- id: zigbee2mqtt_t832_stability_close
  alias: Zigbee2MQTT - T832 stability close
  description: >-
    Every 5 minutes, record one stability observation for a stabilizing
    incident and close it only when the full 10-minute window is covered
    without gaps, outages, clock anomalies, or missing traffic/ZDO evidence.
    R4-F04: bridge/mesh state transitions are also observed passively
    between ticks — a short outage that recovers before the next tick is
    still recorded as counterevidence and rejects the close. Event-driven
    listeners only: no probes.
  triggers:
    - trigger: time_pattern
      minutes: /5
    - trigger: state
      entity_id: binary_sensor.zigbee2mqtt_bridge_online
      from: "on"
      to: "off"
    - trigger: state
      entity_id: binary_sensor.zigbee2mqtt_mesh_communication_outage
      from: "off"
      to: "on"
  conditions: []
  actions:
    # R4-F05: a tool exception or absent response halts the tick loudly
    # here (no observation recorded, no close attempted) instead of
    # aborting mid-body after a partial write.
    - service: shell_command.t832_status
      response_variable: t832_status
      continue_on_error: true
    - condition: template
      value_template: >-
        {{ t832_status is defined and t832_status['returncode'] == 0
           and (t832_status['stdout'] | from_json).status == 'stabilizing' }}
    - service: shell_command.t832_observe
      data:
        bridge_up: "{{ is_state('binary_sensor.zigbee2mqtt_bridge_online', 'on') }}"
        normal_traffic: "{{ is_state('binary_sensor.zigbee2mqtt_mesh_communication_outage', 'off') }}"
        # B09: per-tick continuity evidence, not proof — radio health is
        # only ever proven by the recorded permit_join transaction (bound
        # per observation, gated at close). Both quiet mesh and an online
        # bridge must hold; either one failing is counter-evidence.
        zdo_ok: "{{ is_state('binary_sensor.zigbee2mqtt_mesh_communication_outage', 'off') and is_state('binary_sensor.zigbee2mqtt_bridge_online', 'on') }}"
      response_variable: t832_observed
      continue_on_error: true
    - condition: template
      value_template: "{{ t832_observed is defined and t832_observed['returncode'] == 0 }}"
    - service: shell_command.t832_close_if_stable
      data:
        bridge_up: "{{ is_state('binary_sensor.zigbee2mqtt_bridge_online', 'on') }}"
        normal_traffic: "{{ is_state('binary_sensor.zigbee2mqtt_mesh_communication_outage', 'off') }}"
      response_variable: t832_closed
      continue_on_error: true
    - condition: template
      value_template: "{{ t832_closed is defined and t832_closed['returncode'] == 0 }}"
    - service: system_log.write
      data:
        message: >-
          T832 stability step:
          {{ (t832_closed['stdout'] | from_json).status }}.
        level: info
        logger: t832.barrier
  mode: single
